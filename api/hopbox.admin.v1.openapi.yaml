openapi: 3.1.0
info:
  title: hopbox admin API
  description: The admin API of hopbox, package hopbox.admin.v1. Only instance admins and root on a control server can call it.
  version: v1
paths:
  /hopbox.admin.v1.AccountService/ListAccountSignInMethods:
    post:
      tags:
        - hopbox.admin.v1.AccountService
      summary: ListAccountSignInMethods
      description: ListAccountSignInMethods lists the sign-in methods of one account, oldest first.
      operationId: hopbox.admin.v1.AccountService.ListAccountSignInMethods
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.ListAccountSignInMethodsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.ListAccountSignInMethodsResponse'
  /hopbox.admin.v1.AccountService/RemoveAccountSignInMethod:
    post:
      tags:
        - hopbox.admin.v1.AccountService
      summary: RemoveAccountSignInMethod
      description: |-
        RemoveAccountSignInMethod removes one sign-in method of an account. It refuses the last method
         of the account unless allow_last is true.
      operationId: hopbox.admin.v1.AccountService.RemoveAccountSignInMethod
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.RemoveAccountSignInMethodRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.RemoveAccountSignInMethodResponse'
  /hopbox.admin.v1.AdminKeyService/CreateAdminKey:
    post:
      tags:
        - hopbox.admin.v1.AdminKeyService
      summary: CreateAdminKey
      description: |-
        CreateAdminKey makes an admin API key. The response holds the only copy of the key:
         the install keeps only its hash. A retry with the same idempotency key makes no
         second key. It fails with ALREADY_EXISTS.
      operationId: hopbox.admin.v1.AdminKeyService.CreateAdminKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.CreateAdminKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.CreateAdminKeyResponse'
  /hopbox.admin.v1.AdminKeyService/ListAdminKeys:
    post:
      tags:
        - hopbox.admin.v1.AdminKeyService
      summary: ListAdminKeys
      description: ListAdminKeys lists the admin API keys, oldest first.
      operationId: hopbox.admin.v1.AdminKeyService.ListAdminKeys
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.ListAdminKeysRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.ListAdminKeysResponse'
  /hopbox.admin.v1.AdminKeyService/RegisterAdminKey:
    post:
      tags:
        - hopbox.admin.v1.AdminKeyService
      summary: RegisterAdminKey
      description: |-
        RegisterAdminKey makes an admin API key from the SHA-256 of its secret, so the secret never
         reaches the server. hopboxd install registers the first key of an install this way.
         A second registration of the same hash returns the key of the first one, unchanged.
      operationId: hopbox.admin.v1.AdminKeyService.RegisterAdminKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.RegisterAdminKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.RegisterAdminKeyResponse'
  /hopbox.admin.v1.AdminKeyService/RevokeAdminKey:
    post:
      tags:
        - hopbox.admin.v1.AdminKeyService
      summary: RevokeAdminKey
      description: RevokeAdminKey deletes an admin API key at once.
      operationId: hopbox.admin.v1.AdminKeyService.RevokeAdminKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.RevokeAdminKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.RevokeAdminKeyResponse'
