      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.GetCertificateRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.GetCertificateResponse'
  /hopbox.admin.v1.ImageService/ListImages:
    post:
      tags:
        - hopbox.admin.v1.ImageService
      summary: ListImages
      description: ListImages lists the images of the install, by name, newest first.
      operationId: hopbox.admin.v1.ImageService.ListImages
