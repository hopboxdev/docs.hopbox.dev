components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    hopbox.admin.v1.ACMEStatus:
      type: object
      properties:
        failures:
          type: integer
          title: failures
          format: int32
          description: failures counts the attempts that failed since the last certificate.
        lastAttemptTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_attempt_time
          description: last_attempt_time is the start of the last attempt. It is absent before the first attempt.
        lastError:
          type: string
          title: last_error
          description: |-
            last_error is the error of the last attempt that failed. It is empty after a certificate.
             A change of the install config keeps it until the next attempt.
        nextAttemptTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: next_attempt_time
          description: next_attempt_time is the earliest time of the next attempt after a failure. It is absent after a certificate.
        caWait:
          type: boolean
          title: ca_wait
          description: |-
            ca_wait is true when the CA asked for the wait until next_attempt_time, with a rate limit or a Retry-After.
             A change of the install config does not end such a wait.
        termsUrl:
          type: string
          title: terms_url
          description: |-
            terms_url is the URL of the terms of service of the CA that the directory named at the last attempt.
             The first attempt after an agreement records it, so it is empty before that attempt.
        renewalsStopped:
          type: string
          title: renewals_stopped
          description: |-
            renewals_stopped is why the ACME job plans no renewal of the certificate, such as no agreement to the
             terms of the CA. It is empty while the job renews the certificate, and before the first certificate.
      title: ACMEStatus
      additionalProperties: false
      description: ACMEStatus is the state of the attempts of the ACME job.
    hopbox.admin.v1.AccountSignInMethod:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the method.
        kind:
          type: string
          title: kind
          description: 'kind is the kind of sign-in: email_link, login_link, github, or google.'
        subject:
          type: string
          title: subject
          description: |-
            subject names the identity that the method proves: the email of a link, the numeric user ID at GitHub,
             or the sub claim at Google.
        email:
          type: string
          title: email
          description: email is the email that the method names.
        lastUseTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_use_time
          description: last_use_time is the time of the last sign-in with the method.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the link of the method to the account.
      title: AccountSignInMethod
      additionalProperties: false
      description: AccountSignInMethod is one sign-in method of an account.
    hopbox.admin.v1.ActionInProgress:
      type: object
      properties:
        machineId:
          type: string
          title: machine_id
          description: machine_id is the ID of the machine of the action.
        action:
          type: string
          title: action
          description: action names the action, such as start.
        startTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: start_time is the start of the action.
      title: ActionInProgress
      additionalProperties: false
      description: ActionInProgress is an action that a server started and did not finish yet.
    hopbox.admin.v1.AdminKey:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the key.
        name:
          type: string
          title: name
          description: name is the name that root gave the key, such as terraform.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the key.
        lastUseTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_use_time
          description: last_use_time is the time of the last call with the key, exact to a minute. It is unset for an unused key.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the creation of the key.
      title: AdminKey
      additionalProperties: false
      description: AdminKey is an admin API key without its secret.
    hopbox.admin.v1.AdminKeyLifetime:
      type: string
      title: AdminKeyLifetime
      enum:
        - ADMIN_KEY_LIFETIME_UNSPECIFIED
        - ADMIN_KEY_LIFETIME_30_DAYS
        - ADMIN_KEY_LIFETIME_90_DAYS
        - ADMIN_KEY_LIFETIME_365_DAYS
      description: AdminKeyLifetime is a preset lifetime of a new admin API key.
    hopbox.admin.v1.Allocation:
      type: object
      properties:
        machineId:
          type: string
          title: machine_id
          description: machine_id is the ID of the machine.
        vcpus:
          type: integer
          title: vcpus
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
      title: Allocation
      additionalProperties: false
      description: Allocation is what one machine holds on its server.
    hopbox.admin.v1.CPUFingerprint:
      type: object
      properties:
        arch:
          type: string
          title: arch
          description: arch is the CPU architecture, such as amd64.
        vendor:
          type: string
          title: vendor
          description: vendor is the CPU vendor, such as GenuineIntel.
        family:
          type: integer
          title: family
        model:
          type: integer
          title: model
        stepping:
          type: integer
          title: stepping
        modelName:
          type: string
          title: model_name
          description: model_name is the name of the CPU model, such as Intel(R) Xeon(R) CPU E5-1650 v4 @ 3.60GHz.
        microcode:
          type: string
          title: microcode
          description: microcode is the microcode revision, such as 0xb000040.
        flagsHash:
          type: string
          title: flags_hash
          description: flags_hash is the SHA-256, in hex, of the sorted CPU flags.
        cpuTemplate:
          type: string
          title: cpu_template
          description: cpu_template is the Firecracker CPU template of the server, or none.
      title: CPUFingerprint
      additionalProperties: false
      description: CPUFingerprint describes the CPU of a server.
    hopbox.admin.v1.Capacity:
      type: object
      properties:
        cpuThreads:
          type: integer
          title: cpu_threads
          description: cpu_threads is the count of CPU threads.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the size of the memory.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the size of the file system of the data dir.
        diskFreeBytes:
          type: string
          title: disk_free_bytes
          format: int64
          description: disk_free_bytes is the free space on the file system of the data dir.
      title: Capacity
      additionalProperties: false
      description: Capacity is what the server has for machines.
    hopbox.admin.v1.Certificate:
      type: object
      properties:
        domain:
          type: string
          title: domain
          description: domain is the domain of the install that the certificate covers.
        names:
          type: array
          items:
            type: string
          title: names
          description: 'names are the DNS names of the certificate: the domain and its wildcard.'
        serial:
          type: string
          title: serial
          description: serial is the serial number of the certificate, in lowercase hex.
        issuer:
          type: string
          title: issuer
          description: issuer is the subject of the CA certificate that signed the certificate.
        notBefore:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: not_before
          description: not_before is the start of the validity of the certificate.
        notAfter:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: not_after
          description: not_after is the end of the validity of the certificate.
        renewTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: renew_time
          description: 'renew_time is the time at which the certificate is due for renewal: after two thirds of its lifetime.'
        directoryUrl:
          type: string
          title: directory_url
          description: directory_url is the ACME directory that issued the certificate.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is when the certificate replaced the one before it.
      title: Certificate
      additionalProperties: false
      description: Certificate describes the certificate of the install for its domain and the wildcard of the domain.
    hopbox.admin.v1.ClearOAuthClientRequest:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SignInProvider'
          title: provider
          description: provider is the sign-in provider.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the install config that the caller read.
             If the config has another version now, the call fails with ABORTED and changes nothing.
      title: ClearOAuthClientRequest
      additionalProperties: false
      description: ClearOAuthClientRequest names the provider to turn off.
    hopbox.admin.v1.ClearOAuthClientResponse:
      type: object
      properties:
        client:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OAuthClient'
          title: client
        version:
          type: string
          title: version
          format: int64
          description: version is the version of the install config after the change.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the change.
      title: ClearOAuthClientResponse
      additionalProperties: false
      description: ClearOAuthClientResponse holds the empty client.
    hopbox.admin.v1.ClearSMTPConfigRequest:
      type: object
      title: ClearSMTPConfigRequest
      additionalProperties: false
      description: ClearSMTPConfigRequest has no fields.
    hopbox.admin.v1.ClearSMTPConfigResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SMTPConfig'
          title: config
      title: ClearSMTPConfigResponse
      additionalProperties: false
      description: ClearSMTPConfigResponse holds the empty SMTP config.
    hopbox.admin.v1.ControlProcess:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the process, a UUID. Each start of the control role has a new one.
        serverId:
          type: string
          title: server_id
          description: |-
            server_id is the ID of the enrolled server of the same hopboxd, or empty when no role of
             that hopboxd enrolled.
        hostname:
          type: string
          title: hostname
          description: hostname is the host name of the server of the process.
        internalUrl:
          type: string
          title: internal_url
          description: |-
            internal_url is the URL of the internal listener of the process, such as
             https://172.31.0.11:7443. It is empty when the listener listens on every address.
        release:
          type: string
          title: release
          description: release is the version of hopboxd of the process, such as v0.2.0.
        schemaVersion:
          type: integer
          title: schema_version
          format: int32
          description: schema_version is the number of the newest migration that the hopboxd of the process knows.
        kekIds:
          type: array
          items:
            type: string
          title: kek_ids
          description: kek_ids are the key-encryption keys that the process can open, staged keys too.
        kekCurrent:
          type: string
          title: kek_current
          description: kek_current is the key-encryption key with which the process seals new values.
        maintenance:
          type: boolean
          title: maintenance
          description: maintenance is true when the process applies maintenance mode.
        drained:
          type: boolean
          title: drained
          description: |-
            drained is true in maintenance mode once no call, control channel, or leader job of the
             process runs.
        startTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: start_time is the start of the process.
        renewTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: renew_time
          description: renew_time is the last renewal of the record.
        live:
          type: boolean
          title: live
          description: live is true when the record was renewed in the last 20 seconds.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each renewal.
        stopTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: stop_time
          description: |-
            stop_time is the clean stop of the process. It is absent while the process runs, and after
             an end without a stop. A stopped process keeps its record for 24 hours.
      title: ControlProcess
      additionalProperties: false
      description: |-
        ControlProcess is one process of the control role. It renews its record every 5 seconds, and
         deletes it at its stop.
    hopbox.admin.v1.CordonServerRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server.
      title: CordonServerRequest
      additionalProperties: false
      description: CordonServerRequest names a server.
    hopbox.admin.v1.CordonServerResponse:
      type: object
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: server
      title: CordonServerResponse
      additionalProperties: false
      description: CordonServerResponse holds the server after the change.
    hopbox.admin.v1.CreateAdminKeyRequest:
      type: object
      anyOf:
        - type: object
          properties:
            expireTime:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: expire_time
              description: expire_time is a custom end, in the future and at most 365 days ahead.
          title: expire_time
        - type: object
          properties:
            lifetime:
              allOf:
                - $ref: '#/components/schemas/hopbox.admin.v1.AdminKeyLifetime'
              title: lifetime
              description: lifetime is a preset lifetime.
          title: lifetime
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - expireTime
              - required:
                  - lifetime
          - not:
              oneOf:
                - required:
                    - expireTime
                - required:
                    - lifetime
      properties:
        name:
          type: string
          title: name
          description: name helps people tell the keys apart, such as terraform. It has 1 to 64 characters.
      title: CreateAdminKeyRequest
      description: CreateAdminKeyRequest describes the new key.
    hopbox.admin.v1.CreateAdminKeyResponse:
      type: object
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.AdminKey'
          title: key
        secret:
          type: string
          title: secret
          description: |-
            secret is the key itself, which starts with hbxadm_. It goes in the header
             "Authorization: Bearer <secret>". The install keeps no copy of it.
      title: CreateAdminKeyResponse
      additionalProperties: false
      description: CreateAdminKeyResponse holds the new key and its secret.
    hopbox.admin.v1.CreateEnrollmentTokenRequest:
      type: object
      properties:
        pool:
          type: string
          title: pool
          description: pool is the name of the pool that the new server joins. Leave it empty for the pool default.
        roles:
          type: array
          items:
            type: string
          title: roles
          description: |-
            roles are the roles that the new server can enroll with: node, dns, edge, or more than one.
             Leave it empty for the role node alone.
        serverId:
          type: string
          title: server_id
          description: |-
            server_id names an enrolled server, a UUID. The token then adds the
             roles to that server alone, in its pool, and enrolls no new server.
             Leave it empty for a token of a new server.
      title: CreateEnrollmentTokenRequest
      additionalProperties: false
      description: CreateEnrollmentTokenRequest names the pool of the token.
    hopbox.admin.v1.CreateEnrollmentTokenResponse:
      type: object
      properties:
        token:
          type: string
          title: token
          description: |-
            token is the enrollment token, hbxe_<id>_<secret>_<cahash>. It is a secret.
             Pass it to hopboxd enroll --token on the new server.
        tokenId:
          type: string
          title: token_id
          description: token_id is the ID of the token, as the audit log names it.
        pool:
          type: string
          title: pool
          description: pool is the name of the pool of the token.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the token.
        caHash:
          type: string
          title: ca_hash
          description: ca_hash is the SHA-256, in hex, of the certificate of the install CA. The token holds it too.
        roles:
          type: array
          items:
            type: string
          title: roles
          description: roles are the roles that the new server can enroll with.
        serverId:
          type: string
          title: server_id
          description: server_id is the enrolled server that the token adds roles to, or empty.
      title: CreateEnrollmentTokenResponse
      additionalProperties: false
      description: CreateEnrollmentTokenResponse holds the new token.
    hopbox.admin.v1.CreateLoginLinkRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          description: email is the email of the account, such as ann@example.org.
      title: CreateLoginLinkRequest
      additionalProperties: false
      description: CreateLoginLinkRequest names the email of the account.
    hopbox.admin.v1.CreateLoginLinkResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            url is the link, such as https://hop.example.org/auth/login-link#token=....
             It is a secret until it is used or expires.
        email:
          type: string
          title: email
          description: email is the email of the account, in lower case.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the link.
      title: CreateLoginLinkResponse
      additionalProperties: false
      description: CreateLoginLinkResponse holds the link.
    hopbox.admin.v1.CreatePoolRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the pool, a lowercase DNS label. No other live pool can have it.
        ovhPlan:
          type: string
          title: ovh_plan
          description: |-
            ovh_plan is the OVHcloud plan code of the servers of the pool, such as 24adv01.
             Leave it empty for a pool of adopted servers.
      title: CreatePoolRequest
      additionalProperties: false
      description: CreatePoolRequest names the new pool.
    hopbox.admin.v1.CreatePoolResponse:
      type: object
      properties:
        pool:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Pool'
          title: pool
      title: CreatePoolResponse
      additionalProperties: false
      description: CreatePoolResponse holds the new pool.
    hopbox.admin.v1.CreateSizeRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            name is the name of the size, a lowercase DNS label. No other size can have it, also no
             retired one.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the count of vCPUs, 1 to 32.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: 'memory_bytes is the RAM, in bytes: at least 128 MiB, and a whole number of MiB.'
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: |-
            disk_bytes is the size of the sparse disk, in bytes: at least 1 GB, and a whole number of
             512-byte sectors.
        pool:
          type: string
          title: pool
          description: |-
            pool is the name of a live pool, to keep the machines of the size in it. Leave it empty for
             any pool.
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
          description: labels are the labels that a node must have to take a machine of the size.
      title: CreateSizeRequest
      additionalProperties: false
      description: CreateSizeRequest describes the new size.
    hopbox.admin.v1.CreateSizeResponse:
      type: object
      properties:
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Size'
          title: size
      title: CreateSizeResponse
      additionalProperties: false
      description: CreateSizeResponse holds the new size.
    hopbox.admin.v1.DecommissionServerRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server.
      title: DecommissionServerRequest
      additionalProperties: false
      description: DecommissionServerRequest names a server.
    hopbox.admin.v1.DecommissionServerResponse:
      type: object
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: server
      title: DecommissionServerResponse
      additionalProperties: false
      description: DecommissionServerResponse holds the server after the change.
    hopbox.admin.v1.DefaultOrgLimits:
      type: object
      properties:
        limits:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OrgLimits'
          title: limits
        version:
          type: string
          title: version
          format: int64
          description: version is the version of the install config, which holds the defaults.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change of the install config.
        maxOrgsPerAccount:
          type: integer
          title: max_orgs_per_account
          format: int32
          description: |-
            max_orgs_per_account is the most orgs that one account owns besides its personal org.
             CreateOrg refuses one more with RESOURCE_EXHAUSTED.
      title: DefaultOrgLimits
      additionalProperties: false
      description: |-
        DefaultOrgLimits are the limits of every org without an override,
         and the most orgs that one account owns.
    hopbox.admin.v1.DeleteMachineRequest:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      title: DeleteMachineRequest
      description: DeleteMachineRequest names one machine.
    hopbox.admin.v1.DeleteMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Machine'
          title: machine
          description: machine is the machine at the end of the wait.
        duration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: duration
          description: duration is how long the call took, the wait included.
        done:
          type: boolean
          title: done
          description: done is true when the machine is deleted at the end of the wait.
      title: DeleteMachineResponse
      additionalProperties: false
      description: DeleteMachineResponse holds the machine after the wait.
    hopbox.admin.v1.DeletePoolRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the pool.
      title: DeletePoolRequest
      additionalProperties: false
      description: DeletePoolRequest names a pool.
    hopbox.admin.v1.DeletePoolResponse:
      type: object
      title: DeletePoolResponse
      additionalProperties: false
      description: DeletePoolResponse has no fields.
    hopbox.admin.v1.GetCertificateRequest:
      type: object
      title: GetCertificateRequest
      additionalProperties: false
      description: GetCertificateRequest has no fields.
    hopbox.admin.v1.GetCertificateResponse:
      type: object
      properties:
        certificate:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Certificate'
          title: certificate
          description: certificate is absent before the first certificate of the install.
        status:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.ACMEStatus'
          title: status
          description: status is the state of the ACME job.
      title: GetCertificateResponse
      additionalProperties: false
      description: GetCertificateResponse holds the certificate and the state of the ACME job.
    hopbox.admin.v1.GetDefaultOrgLimitsRequest:
      type: object
      title: GetDefaultOrgLimitsRequest
      additionalProperties: false
      description: GetDefaultOrgLimitsRequest has no fields.
    hopbox.admin.v1.GetDefaultOrgLimitsResponse:
      type: object
      properties:
        defaults:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.DefaultOrgLimits'
          title: defaults
      title: GetDefaultOrgLimitsResponse
      additionalProperties: false
      description: GetDefaultOrgLimitsResponse holds the defaults.
    hopbox.admin.v1.GetInstallConfigRequest:
      type: object
      title: GetInstallConfigRequest
      additionalProperties: false
      description: GetInstallConfigRequest has no fields.
    hopbox.admin.v1.GetInstallConfigResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.InstallConfig'
          title: config
      title: GetInstallConfigResponse
      additionalProperties: false
      description: GetInstallConfigResponse holds the settings.
    hopbox.admin.v1.GetMailFileRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the file, as ListMailFiles returns it.
      title: GetMailFileRequest
      additionalProperties: false
      description: GetMailFileRequest names one mail file.
    hopbox.admin.v1.GetMailFileResponse:
      type: object
      properties:
        file:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.MailFile'
          title: file
        content:
          type: string
          title: content
          format: byte
          description: |-
            content is the whole file: an RFC 5322 message, with the headers and the body that the SMTP transport
             sends. The body is in quoted-printable, so a long link in it breaks over two lines.
        text:
          type: string
          title: text
          description: text is the body, decoded from its transfer encoding, with plain newlines. A link in it is whole.
      title: GetMailFileResponse
      additionalProperties: false
      description: GetMailFileResponse holds one mail file.
    hopbox.admin.v1.GetOAuthConfigRequest:
      type: object
      title: GetOAuthConfigRequest
      additionalProperties: false
      description: GetOAuthConfigRequest has no fields.
    hopbox.admin.v1.GetOAuthConfigResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.OAuthClient'
          title: clients
        version:
          type: string
          title: version
          format: int64
          description: version is the version of the whole install config.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change of the install config.
      title: GetOAuthConfigResponse
      additionalProperties: false
      description: GetOAuthConfigResponse holds one client for each provider, GitHub first.
    hopbox.admin.v1.GetPoolRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the pool.
      title: GetPoolRequest
      additionalProperties: false
      description: GetPoolRequest names a pool.
    hopbox.admin.v1.GetPoolResponse:
      type: object
      properties:
        pool:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Pool'
          title: pool
      title: GetPoolResponse
      additionalProperties: false
      description: GetPoolResponse holds the pool.
    hopbox.admin.v1.GetSMTPConfigRequest:
      type: object
      title: GetSMTPConfigRequest
      additionalProperties: false
      description: GetSMTPConfigRequest has no fields.
    hopbox.admin.v1.GetSMTPConfigResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SMTPConfig'
          title: config
      title: GetSMTPConfigResponse
      additionalProperties: false
      description: GetSMTPConfigResponse holds the SMTP config.
    hopbox.admin.v1.GetServerRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server.
      title: GetServerRequest
      additionalProperties: false
      description: GetServerRequest names a server.
    hopbox.admin.v1.GetServerResponse:
      type: object
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: server
      title: GetServerResponse
      additionalProperties: false
      description: GetServerResponse holds the server.
    hopbox.admin.v1.GetSizeRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the size.
      title: GetSizeRequest
      additionalProperties: false
      description: GetSizeRequest names a size.
    hopbox.admin.v1.GetSizeResponse:
      type: object
      properties:
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Size'
          title: size
      title: GetSizeResponse
      additionalProperties: false
      description: GetSizeResponse holds the size.
    hopbox.admin.v1.GrantInstanceAdminRequest:
      type: object
      anyOf:
        - type: object
          properties:
            accountId:
              type: string
              title: account_id
              description: account_id is the UUID of the account.
          title: account_id
        - type: object
          properties:
            email:
              type: string
              title: email
              description: email is a verified email of the account. An unverified email names no account.
          title: email
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - accountId
              - required:
                  - email
          - not:
              oneOf:
                - required:
                    - accountId
                - required:
                    - email
      title: GrantInstanceAdminRequest
      description: GrantInstanceAdminRequest names the account.
    hopbox.admin.v1.GrantInstanceAdminResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account that is now an instance admin.
      title: GrantInstanceAdminResponse
      additionalProperties: false
      description: GrantInstanceAdminResponse names the account.
    hopbox.admin.v1.Image:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the image.
        name:
          type: string
          title: name
          description: name is the name of the image, for example default.
        digest:
          type: string
          title: digest
          description: 'digest is sha256: and the sha256 of the artifact.json of the image, in hex.'
        arch:
          type: string
          title: arch
          description: arch is the CPU architecture of the image, x86_64.
        kernelSha256:
          type: string
          title: kernel_sha256
          description: kernel_sha256 is the sha256 of the guest kernel that the image needs, in hex.
        diskSize:
          type: string
          title: disk_size
          format: int64
          description: disk_size is the size of the disk of the image, in bytes.
        diskSha256:
          type: string
          title: disk_sha256
          description: disk_sha256 is the sha256 of the disk of the image, in hex.
        url:
          type: string
          title: url
          description: url is where nodes download the compressed disk, or empty.
        buildTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: build_time
          description: build_time is the time of the build, from artifact.json.
        registerTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: register_time
          description: register_time is the time of the registration.
      title: Image
      additionalProperties: false
      description: Image is the metadata of one image artifact.
    hopbox.admin.v1.InstallConfig:
      type: object
      properties:
        domain:
          type: string
          title: domain
          description: |-
            domain is the domain of the install, for example hop.example.org.
             It is empty until an instance admin sets it.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change.
        publicAddresses:
          type: array
          items:
            type: string
          title: public_addresses
          description: |-
            public_addresses are the IPv4 and IPv6 addresses at which the edge servers take traffic.
             The DNS role points the domain, ns1, ns2, and every machine name at them.
             It is empty until an instance admin sets it.
        acmeDirectoryUrl:
          type: string
          title: acme_directory_url
          description: |-
            acme_directory_url is the ACME directory of the CA that issues the wildcard certificate of the install.
             The default is the production CA of Let's Encrypt, https://acme-v02.api.letsencrypt.org/directory.
        acmeEmail:
          type: string
          title: acme_email
          description: acme_email is the contact email of the ACME account of the install. It is empty when the account has no contact.
        acmeTermsAgreed:
          type: boolean
          title: acme_terms_agreed
          description: |-
            acme_terms_agreed is true once an instance admin agreed to the terms of the CA of acme_directory_url.
             The install asks for no certificate before that.
        mailTransport:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.MailTransport'
          title: mail_transport
          description: mail_transport is how the install delivers its mail. The default is MAIL_TRANSPORT_SMTP.
        maintenance:
          type: boolean
          title: maintenance
          description: maintenance is true while the install is in maintenance mode. SetMaintenance changes it.
      title: InstallConfig
      additionalProperties: false
      description: InstallConfig holds the settings of the install.
    hopbox.admin.v1.InstanceAdmin:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account.
        displayName:
          type: string
          title: display_name
          description: display_name is the display name of the account.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.InstanceAdminEmail'
          title: emails
          description: emails lists the emails of the account.
        grantTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: grant_time
          description: grant_time is the time of the grant.
      title: InstanceAdmin
      additionalProperties: false
      description: InstanceAdmin is an account with the instance admin role.
    hopbox.admin.v1.InstanceAdminEmail:
      type: object
      properties:
        email:
          type: string
          title: email
          description: email is the address, in lower case.
        verified:
          type: boolean
          title: verified
          description: verified is true when a sign-in method proved the email.
      title: InstanceAdminEmail
      additionalProperties: false
      description: InstanceAdminEmail is one email of an instance admin.
    hopbox.admin.v1.KEK:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the key, such as file:1.
        current:
          type: boolean
          title: current
          description: current is true for the key that seals new values.
        inKeyring:
          type: boolean
          title: in_keyring
          description: |-
            in_keyring is false for a key that a sealed value names, but whose key file is gone.
             Such a value does not open.
        sealedValues:
          type: string
          title: sealed_values
          format: int64
          description: sealed_values counts the values whose data key this key seals.
        staged:
          type: boolean
          title: staged
          description: staged is true for a staged key, which opens values but seals none until a promote.
      title: KEK
      additionalProperties: false
      description: KEK is one key-encryption key.
    hopbox.admin.v1.ListAccountSignInMethodsRequest:
      type: object
      anyOf:
        - type: object
          properties:
            accountId:
              type: string
              title: account_id
              description: account_id is the UUID of the account.
          title: account_id
        - type: object
          properties:
            email:
              type: string
              title: email
              description: email is a verified email of the account. An unverified email names no account.
          title: email
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - accountId
              - required:
                  - email
          - not:
              oneOf:
                - required:
                    - accountId
                - required:
                    - email
      title: ListAccountSignInMethodsRequest
      description: ListAccountSignInMethodsRequest names the account.
    hopbox.admin.v1.ListAccountSignInMethodsResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account.
        methods:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.AccountSignInMethod'
          title: methods
      title: ListAccountSignInMethodsResponse
      additionalProperties: false
      description: ListAccountSignInMethodsResponse lists the methods.
    hopbox.admin.v1.ListAdminKeysRequest:
      type: object
      title: ListAdminKeysRequest
      additionalProperties: false
      description: ListAdminKeysRequest has no fields.
    hopbox.admin.v1.ListAdminKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.AdminKey'
          title: keys
      title: ListAdminKeysResponse
      additionalProperties: false
      description: ListAdminKeysResponse lists the keys.
    hopbox.admin.v1.ListControlProcessesRequest:
      type: object
      title: ListControlProcessesRequest
      additionalProperties: false
      description: ListControlProcessesRequest has no fields.
    hopbox.admin.v1.ListControlProcessesResponse:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.ControlProcess'
          title: processes
      title: ListControlProcessesResponse
      additionalProperties: false
      description: |-
        ListControlProcessesResponse holds the control processes, live or not. A process that ended
         without its stop keeps its record for 24 hours.
    hopbox.admin.v1.ListImagesRequest:
      type: object
      title: ListImagesRequest
      additionalProperties: false
      description: ListImagesRequest has no fields.
    hopbox.admin.v1.ListImagesResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Image'
          title: images
          description: images are the images, by name, newest first.
      title: ListImagesResponse
      additionalProperties: false
      description: ListImagesResponse holds the images.
    hopbox.admin.v1.ListInstanceAdminsRequest:
      type: object
      title: ListInstanceAdminsRequest
      additionalProperties: false
      description: ListInstanceAdminsRequest has no fields.
    hopbox.admin.v1.ListInstanceAdminsResponse:
      type: object
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.InstanceAdmin'
          title: admins
      title: ListInstanceAdminsResponse
      additionalProperties: false
      description: ListInstanceAdminsResponse lists the instance admins.
    hopbox.admin.v1.ListKEKsRequest:
      type: object
      title: ListKEKsRequest
      additionalProperties: false
      description: ListKEKsRequest has no fields.
    hopbox.admin.v1.ListKEKsResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.KEK'
          title: keys
      title: ListKEKsResponse
      additionalProperties: false
      description: ListKEKsResponse lists the keys, oldest first. A key that is not in the keyring comes last.
    hopbox.admin.v1.ListMachinesRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id, when set, lists only the machines of this org.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: page_size is the most machines in one response, 1 to 1000. 0 takes 100.
        pageToken:
          type: string
          title: page_token
          description: page_token is the next_page_token of the response before. Leave it empty for the first page.
      title: ListMachinesRequest
      additionalProperties: false
      description: ListMachinesRequest asks for one page of machines.
    hopbox.admin.v1.ListMachinesResponse:
      type: object
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Machine'
          title: machines
          description: machines are the machines of the page.
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token reads the next page. It is empty on the last page.
      title: ListMachinesResponse
      additionalProperties: false
      description: ListMachinesResponse holds one page of machines.
    hopbox.admin.v1.ListMailFilesRequest:
      type: object
      title: ListMailFilesRequest
      additionalProperties: false
      description: ListMailFilesRequest has no fields.
    hopbox.admin.v1.ListMailFilesResponse:
      type: object
      properties:
        dir:
          type: string
          title: dir
          description: dir is the mail folder of the server, such as /var/lib/hopbox/mail.
        files:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.MailFile'
          title: files
          description: files lists the files, newest first. It is empty when the folder does not exist.
      title: ListMailFilesResponse
      additionalProperties: false
      description: ListMailFilesResponse lists the mail files.
    hopbox.admin.v1.ListOrgsRequest:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: page_size is the most orgs in one response, 1 to 1000. 0 means 100.
        pageToken:
          type: string
          title: page_token
          description: page_token is the next_page_token of the response before. Leave it empty for the first page.
      title: ListOrgsRequest
      additionalProperties: false
      description: ListOrgsRequest selects a page.
    hopbox.admin.v1.ListOrgsResponse:
      type: object
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Org'
          title: orgs
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token reads the next page. It is empty on the last page.
      title: ListOrgsResponse
      additionalProperties: false
      description: ListOrgsResponse holds one page of orgs.
    hopbox.admin.v1.ListPoolsRequest:
      type: object
      title: ListPoolsRequest
      additionalProperties: false
      description: ListPoolsRequest has no fields.
    hopbox.admin.v1.ListPoolsResponse:
      type: object
      properties:
        pools:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Pool'
          title: pools
      title: ListPoolsResponse
      additionalProperties: false
      description: ListPoolsResponse holds the pools.
    hopbox.admin.v1.ListServersRequest:
      type: object
      title: ListServersRequest
      additionalProperties: false
      description: ListServersRequest has no fields.
    hopbox.admin.v1.ListServersResponse:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: servers
      title: ListServersResponse
      additionalProperties: false
      description: ListServersResponse holds the servers.
    hopbox.admin.v1.ListSizesRequest:
      type: object
      properties:
        includeRetired:
          type: boolean
          title: include_retired
          description: include_retired adds the retired sizes to the list.
      title: ListSizesRequest
      additionalProperties: false
      description: ListSizesRequest says which sizes to list.
    hopbox.admin.v1.ListSizesResponse:
      type: object
      properties:
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Size'
          title: sizes
      title: ListSizesResponse
      additionalProperties: false
      description: ListSizesResponse holds the sizes.
    hopbox.admin.v1.Machine:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machine
          description: machine is the machine as its users see it.
        serverId:
          type: string
          title: server_id
          description: server_id is the UUID of the node of the machine.
      title: Machine
      additionalProperties: false
      description: Machine is a machine with the facts that only instance admins see.
    hopbox.admin.v1.MailFile:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            name is the name of the file, such as 20261023T091530.123456789Z-0123456789abcdef.eml.
             The names sort by the time of the write.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the write, from the name.
        to:
          type: string
          title: to
          description: to is the To header of the mail, such as <ann@example.org>.
        subject:
          type: string
          title: subject
          description: subject is the Subject header of the mail, decoded.
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
          description: size_bytes is the size of the file.
      title: MailFile
      additionalProperties: false
      description: MailFile describes one mail file.
    hopbox.admin.v1.MailTransport:
      type: string
      title: MailTransport
      enum:
        - MAIL_TRANSPORT_UNSPECIFIED
        - MAIL_TRANSPORT_SMTP
        - MAIL_TRANSPORT_FILE
      description: MailTransport says how the install delivers its mail.
    hopbox.admin.v1.OAuthClient:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SignInProvider'
          title: provider
          description: provider is the sign-in provider.
        clientId:
          type: string
          title: client_id
          description: client_id is the client ID that the provider gave the operator. It is empty while the provider is off.
        clientSecretSet:
          type: boolean
          title: client_secret_set
          description: client_secret_set is true when the client has a secret. The API never returns the secret.
        redirectUri:
          type: string
          title: redirect_uri
          description: |-
            redirect_uri is the URI to register at the provider, such as https://hop.example.org/auth/github/callback.
             It is empty until the install has a domain.
        enabled:
          type: boolean
          title: enabled
          description: 'enabled is true when people can sign in with the provider: the client is set, and the install has a domain.'
      title: OAuthClient
      additionalProperties: false
      description: OAuthClient is the OAuth client of one sign-in provider, without its secret.
    hopbox.admin.v1.Org:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the org.
        name:
          type: string
          title: name
          description: name is the name of the org.
        personalAccountId:
          type: string
          title: personal_account_id
          description: personal_account_id is the UUID of the account of a personal org, or empty for another org.
        memberCount:
          type: string
          title: member_count
          format: int64
          description: member_count counts the members of the org.
        suspended:
          type: boolean
          title: suspended
          description: suspended is true while the org is suspended.
        suspendTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: suspend_time
          description: suspend_time is the start of the suspension. It is unset for an org that is not suspended.
        suspendReason:
          type: string
          title: suspend_reason
          description: suspend_reason is the reason of the suspension, or empty.
        limits:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OrgLimits'
          title: limits
          description: 'limits are the limits that apply: each override, else the default of the install.'
        limitOverrides:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OrgLimitOverrides'
          title: limit_overrides
          description: limit_overrides are the limits that an instance admin set for this org.
        usage:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OrgUsage'
          title: usage
          description: usage is what the org uses now.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the org.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time when the org was created.
      title: Org
      additionalProperties: false
      description: Org is the metadata of one org.
    hopbox.admin.v1.OrgLimitOverrides:
      type: object
      properties:
        machines:
          type:
            - integer
            - "null"
          title: machines
          format: int32
          description: machines is the most machines, 0 or more.
        vcpus:
          type:
            - integer
            - "null"
          title: vcpus
          format: int32
          description: vcpus is the most vCPUs of all machines together, 0 or more.
        memoryBytes:
          type:
            - string
            - "null"
          title: memory_bytes
          format: int64
          description: memory_bytes is the most RAM of all machines together, in bytes, 0 or more.
        diskBytes:
          type:
            - string
            - "null"
          title: disk_bytes
          format: int64
          description: disk_bytes is the most disk of all machines together, in bytes, 0 or more.
      title: OrgLimitOverrides
      additionalProperties: false
      description: |-
        OrgLimitOverrides are the limits of one org that replace the defaults of the install.
         A field that is not set takes the default.
    hopbox.admin.v1.OrgLimits:
      type: object
      properties:
        machines:
          type: integer
          title: machines
          format: int32
          description: machines is the most machines.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the most vCPUs of all machines together.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the most RAM of all machines together, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the most disk of all machines together, in bytes.
      title: OrgLimits
      additionalProperties: false
      description: OrgLimits are usage limits. A limit of 0 allows nothing.
    hopbox.admin.v1.OrgUsage:
      type: object
      properties:
        machines:
          type: integer
          title: machines
          format: int32
          description: machines counts the machines.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus counts the vCPUs of all machines.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the RAM of all machines, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the disk of all machines, in bytes.
      title: OrgUsage
      additionalProperties: false
      description: OrgUsage is what an org uses of its limits.
    hopbox.admin.v1.Pool:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the pool, a UUID.
        name:
          type: string
          title: name
          description: name is the name of the pool, a lowercase DNS label, such as default.
        ovhPlan:
          type: string
          title: ovh_plan
          description: ovh_plan is the OVHcloud plan code of the servers of the pool, such as 24adv01, or empty.
        hardware:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.PoolHardware'
          title: hardware
          description: |-
            hardware is the hardware of the first server that enrolled into the pool. It is absent
             before that enrollment. The enrollment of a server with other hardware fails. A pool whose
             servers are all decommissioned takes the hardware of its next server.
        serverCount:
          type: integer
          title: server_count
          format: int32
          description: server_count is the count of servers of the pool that are not decommissioned.
        sizeCount:
          type: integer
          title: size_count
          format: int32
          description: size_count is the count of sizes that name the pool and are not retired.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the pool.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the create.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change.
      title: Pool
      additionalProperties: false
      description: Pool is a named group of servers.
    hopbox.admin.v1.PoolHardware:
      type: object
      properties:
        cpuModel:
          type: string
          title: cpu_model
          description: cpu_model is the model name of the CPU, such as AMD EPYC 4244P 6-Core Processor.
        cpuThreads:
          type: integer
          title: cpu_threads
          description: cpu_threads is the count of CPU threads.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the RAM that the kernel sees, in bytes.
        diskBytes:
          type: array
          items:
            type: string
            format: int64
          title: disk_bytes
          description: disk_bytes are the sizes of the whole disks, in bytes, smallest first.
      title: PoolHardware
      additionalProperties: false
      description: PoolHardware is the hardware of the servers of a pool.
    hopbox.admin.v1.PromoteKEKRequest:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          description: key_id is the ID of a staged key-encryption key, for example file:2.
      title: PromoteKEKRequest
      additionalProperties: false
      description: PromoteKEKRequest names the staged key.
    hopbox.admin.v1.PromoteKEKResponse:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          description: key_id is the ID of the key that now seals new values.
      title: PromoteKEKResponse
      additionalProperties: false
      description: PromoteKEKResponse names the new current key.
    hopbox.admin.v1.PublicAddresses:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
          title: addresses
          description: |-
            addresses holds at most 16 IPv4 or IPv6 addresses, none twice. An address must not be
             unspecified, multicast, or link-local, and must not have an IPv6 zone.
      title: PublicAddresses
      additionalProperties: false
      description: PublicAddresses is a list of public addresses of the install.
    hopbox.admin.v1.RegisterAdminKeyRequest:
      type: object
      anyOf:
        - type: object
          properties:
            expireTime:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: expire_time
              description: expire_time is a custom end, in the future and at most 365 days ahead.
          title: expire_time
        - type: object
          properties:
            lifetime:
              allOf:
                - $ref: '#/components/schemas/hopbox.admin.v1.AdminKeyLifetime'
              title: lifetime
              description: lifetime is a preset lifetime.
          title: lifetime
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - expireTime
              - required:
                  - lifetime
          - not:
              oneOf:
                - required:
                    - expireTime
                - required:
                    - lifetime
      properties:
        name:
          type: string
          title: name
          description: name helps people tell the keys apart, such as terraform. It has 1 to 64 characters.
        sha256:
          type: string
          title: sha256
          description: sha256 is the SHA-256 of the whole key text, hbxadm_ included, in 64 lowercase hex characters.
      title: RegisterAdminKeyRequest
      description: RegisterAdminKeyRequest holds the hash of a key that the caller made.
    hopbox.admin.v1.RegisterAdminKeyResponse:
      type: object
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.AdminKey'
          title: key
        registered:
          type: boolean
          title: registered
          description: registered is false when an earlier call registered the hash already.
      title: RegisterAdminKeyResponse
      additionalProperties: false
      description: RegisterAdminKeyResponse names the key of the hash.
    hopbox.admin.v1.RegisterImageRequest:
      type: object
      properties:
        metadata:
          type: string
          title: metadata
          format: byte
          description: metadata is the bytes of the artifact.json of the image, unchanged, because its sha256 is the digest.
        url:
          type: string
          title: url
          description: url is an https URL of the compressed disk, or empty.
      title: RegisterImageRequest
      additionalProperties: false
      description: RegisterImageRequest holds the metadata of an image artifact.
    hopbox.admin.v1.RegisterImageResponse:
      type: object
      properties:
        image:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Image'
          title: image
          description: image is the image.
        registered:
          type: boolean
          title: registered
          description: registered is false when the install had the image already.
      title: RegisterImageResponse
      additionalProperties: false
      description: RegisterImageResponse holds the image.
    hopbox.admin.v1.RemoveAccountSignInMethodRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account.
        methodId:
          type: string
          title: method_id
          description: method_id is the UUID of the method, as ListAccountSignInMethods returns it.
        allowLast:
          type: boolean
          title: allow_last
          description: |-
            allow_last removes the method also when it is the last one of the account. The account then signs in
             only through a new method that proves one of its verified emails.
      title: RemoveAccountSignInMethodRequest
      additionalProperties: false
      description: RemoveAccountSignInMethodRequest names the method.
    hopbox.admin.v1.RemoveAccountSignInMethodResponse:
      type: object
      title: RemoveAccountSignInMethodResponse
      additionalProperties: false
      description: RemoveAccountSignInMethodResponse has no fields.
    hopbox.admin.v1.RetireSizeRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the size.
      title: RetireSizeRequest
      additionalProperties: false
      description: RetireSizeRequest names a size.
    hopbox.admin.v1.RetireSizeResponse:
      type: object
      properties:
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Size'
          title: size
      title: RetireSizeResponse
      additionalProperties: false
      description: RetireSizeResponse holds the size after the change.
    hopbox.admin.v1.RevokeAdminKeyRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the key.
      title: RevokeAdminKeyRequest
      additionalProperties: false
      description: RevokeAdminKeyRequest names the key.
    hopbox.admin.v1.RevokeAdminKeyResponse:
      type: object
      title: RevokeAdminKeyResponse
      additionalProperties: false
      description: RevokeAdminKeyResponse has no fields.
    hopbox.admin.v1.RevokeInstanceAdminRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account.
      title: RevokeInstanceAdminRequest
      additionalProperties: false
      description: RevokeInstanceAdminRequest names the account.
    hopbox.admin.v1.RevokeInstanceAdminResponse:
      type: object
      title: RevokeInstanceAdminResponse
      additionalProperties: false
      description: RevokeInstanceAdminResponse has no fields.
    hopbox.admin.v1.RewrapSealedValuesRequest:
      type: object
      title: RewrapSealedValuesRequest
      additionalProperties: false
      description: RewrapSealedValuesRequest has no fields.
    hopbox.admin.v1.RewrapSealedValuesResponse:
      type: object
      properties:
        currentKeyId:
          type: string
          title: current_key_id
          description: current_key_id is the ID of the key that now seals the values.
        rewrapped:
          type: string
          title: rewrapped
          format: int64
          description: rewrapped counts the values that moved to the current key.
        keys:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.KEK'
          title: keys
          description: keys lists every key after the rewrap, as ListKEKs does.
      title: RewrapSealedValuesResponse
      additionalProperties: false
      description: RewrapSealedValuesResponse reports the rewrap.
    hopbox.admin.v1.RotateKEKRequest:
      type: object
      title: RotateKEKRequest
      additionalProperties: false
      description: RotateKEKRequest has no fields.
    hopbox.admin.v1.RotateKEKResponse:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          description: key_id is the ID of the new current key-encryption key, for example file:2.
      title: RotateKEKResponse
      additionalProperties: false
      description: RotateKEKResponse names the new key.
    hopbox.admin.v1.SMTPConfig:
      type: object
      properties:
        host:
          type: string
          title: host
          description: host is the host name or the IP address of the server. It is empty when the install has no SMTP config.
        port:
          type: integer
          title: port
          format: int32
          description: port is the TCP port of the server.
        tls:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SMTPSecurity'
          title: tls
          description: tls says how the connection is encrypted.
        username:
          type: string
          title: username
          description: username is the SMTP login, or empty for a server without a login.
        passwordSet:
          type: boolean
          title: password_set
          description: password_set is true when the config has a password. The API never returns the password.
        from:
          type: string
          title: from
          description: from is the sender of the mail, such as "hopbox <no-reply@example.org>".
        version:
          type: string
          title: version
          format: int64
          description: version is the version of the whole install config.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change of the install config.
        mailTransport:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.MailTransport'
          title: mail_transport
          description: mail_transport is how the install delivers its mail now. With MAIL_TRANSPORT_FILE, the install does not use this server.
      title: SMTPConfig
      additionalProperties: false
      description: SMTPConfig is the SMTP server that sends the sign-in links, without its password.
    hopbox.admin.v1.SMTPSecurity:
      type: string
      title: SMTPSecurity
      enum:
        - SMTP_SECURITY_UNSPECIFIED
        - SMTP_SECURITY_STARTTLS
        - SMTP_SECURITY_TLS
        - SMTP_SECURITY_NONE
      description: SMTPSecurity says how the connection to the SMTP server is encrypted.
    hopbox.admin.v1.Server:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server, a UUID.
        pool:
          type: string
          title: pool
          description: pool is the name of the pool of the server.
        hostname:
          type: string
          title: hostname
          description: hostname is the host name that the server sent at its enrollment.
        roles:
          type: array
          items:
            type: string
          title: roles
          description: roles are the roles of the server, such as node or dns. Its certificate carries them.
        state:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.ServerState'
          title: state
        cordoned:
          type: boolean
          title: cordoned
          description: cordoned is true while an instance admin keeps the server cordoned, also while it is unresponsive.
        status:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.ServerStatus'
          title: status
        problems:
          type: array
          items:
            type: string
          title: problems
          description: problems are the failed checks of the last heartbeat, such as a missing /dev/kvm.
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
          description: labels are the labels of the server, such as zone=gra.
        hopboxdVersion:
          type: string
          title: hopboxd_version
          description: hopboxd_version is the version of hopboxd on the server, such as v0.1.0.
        kernelRelease:
          type: string
          title: kernel_release
          description: kernel_release is the release of the host kernel, such as 6.18.57-hopbox1.
        cpu:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.CPUFingerprint'
          title: cpu
        compatibilityClass:
          type: string
          title: compatibility_class
          description: compatibility_class names the servers that can restore the memory state of each other.
        capacity:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Capacity'
          title: capacity
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.Allocation'
          title: allocations
          description: allocations are the resources that the machines of the server hold.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.admin.v1.ActionInProgress'
          title: actions
          description: actions are the actions that the server started and did not finish yet.
        lastHeartbeatTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_heartbeat_time
          description: last_heartbeat_time is the time of the last heartbeat. It is absent before the first one.
        enrollTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: enroll_time
          description: enroll_time is the time of the enrollment.
        certificateExpireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: certificate_expire_time
          description: certificate_expire_time is the end of the newest certificate of the server.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the row, such as each heartbeat.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change.
        labelsSetByAdmin:
          type: boolean
          title: labels_set_by_admin
          description: |-
            labels_set_by_admin is true once SetServerLabels set the labels. The install then ignores
             the labels of the heartbeats.
        machineCount:
          type: integer
          title: machine_count
          format: int32
          description: |-
            machine_count is the count of machines on the server that their executor has not deleted
             yet, stopped machines included. Their disks live on the server.
      title: Server
      additionalProperties: false
      description: Server is one enrolled server, with the facts of its last heartbeat.
    hopbox.admin.v1.ServerState:
      type: string
      title: ServerState
      enum:
        - SERVER_STATE_UNSPECIFIED
        - SERVER_STATE_READY
        - SERVER_STATE_CORDONED
        - SERVER_STATE_UNRESPONSIVE
        - SERVER_STATE_DECOMMISSIONED
      description: ServerState is the state of a server.
    hopbox.admin.v1.ServerStatus:
      type: string
      title: ServerStatus
      enum:
        - SERVER_STATUS_UNSPECIFIED
        - SERVER_STATUS_OK
        - SERVER_STATUS_DEGRADED
      description: ServerStatus is the health that a server reports in its heartbeats.
    hopbox.admin.v1.SetDefaultOrgLimitsRequest:
      type: object
      properties:
        machines:
          type:
            - integer
            - "null"
          title: machines
          format: int32
          description: machines is the most machines of an org, 0 or more. Leave it out to keep the value.
        vcpus:
          type:
            - integer
            - "null"
          title: vcpus
          format: int32
          description: vcpus is the most vCPUs of an org, 0 or more. Leave it out to keep the value.
        memoryBytes:
          type:
            - string
            - "null"
          title: memory_bytes
          format: int64
          description: memory_bytes is the most RAM of an org, in bytes, 0 or more. Leave it out to keep the value.
        diskBytes:
          type:
            - string
            - "null"
          title: disk_bytes
          format: int64
          description: disk_bytes is the most disk of an org, in bytes, 0 or more. Leave it out to keep the value.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the install config that the caller read.
             If the install config has another version now, the call fails with ABORTED and changes nothing.
        maxOrgsPerAccount:
          type:
            - integer
            - "null"
          title: max_orgs_per_account
          format: int32
          description: |-
            max_orgs_per_account is the most orgs that one account owns besides its personal org, 0 or more.
             Leave it out to keep the value.
      title: SetDefaultOrgLimitsRequest
      additionalProperties: false
      description: SetDefaultOrgLimitsRequest holds the defaults to change.
    hopbox.admin.v1.SetDefaultOrgLimitsResponse:
      type: object
      properties:
        defaults:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.DefaultOrgLimits'
          title: defaults
      title: SetDefaultOrgLimitsResponse
      additionalProperties: false
      description: SetDefaultOrgLimitsResponse holds the defaults after the change.
    hopbox.admin.v1.SetMaintenanceRequest:
      type: object
      properties:
        maintenance:
          type: boolean
          title: maintenance
          description: |-
            maintenance set to true turns maintenance mode on, and false turns it off.
             A request for the state that the install has already changes nothing, and succeeds.
      title: SetMaintenanceRequest
      additionalProperties: false
      description: SetMaintenanceRequest names the new state of maintenance mode.
    hopbox.admin.v1.SetMaintenanceResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.InstallConfig'
          title: config
      title: SetMaintenanceResponse
      additionalProperties: false
      description: SetMaintenanceResponse holds the settings after the change.
    hopbox.admin.v1.SetOAuthClientRequest:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SignInProvider'
          title: provider
          description: provider is the sign-in provider.
        clientId:
          type: string
          title: client_id
          description: 'client_id is the client ID that the provider gave: 1 to 256 printable ASCII characters, without spaces.'
        clientSecret:
          type:
            - string
            - "null"
          title: client_secret
          description: |-
            client_secret is the client secret that the provider gave: 1 to 512 printable ASCII characters, without spaces.
             Leave it out to keep the secret that is set now. A new client ID needs the secret again.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the install config that the caller read.
             If the config has another version now, the call fails with ABORTED and changes nothing.
      title: SetOAuthClientRequest
      additionalProperties: false
      description: SetOAuthClientRequest holds the new client of one provider.
    hopbox.admin.v1.SetOAuthClientResponse:
      type: object
      properties:
        client:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OAuthClient'
          title: client
        version:
          type: string
          title: version
          format: int64
          description: version is the version of the install config after the change.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the change.
      title: SetOAuthClientResponse
      additionalProperties: false
      description: SetOAuthClientResponse holds the client after the change.
    hopbox.admin.v1.SetOrgLimitsRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org.
        limitOverrides:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.OrgLimitOverrides'
          title: limit_overrides
          description: limit_overrides replace every override of the org.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the org that the caller read.
             If the org has another version now, the call fails with ABORTED and changes nothing.
      title: SetOrgLimitsRequest
      additionalProperties: false
      description: SetOrgLimitsRequest holds the new overrides.
    hopbox.admin.v1.SetOrgLimitsResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Org'
          title: org
      title: SetOrgLimitsResponse
      additionalProperties: false
      description: SetOrgLimitsResponse holds the org after the change.
    hopbox.admin.v1.SetSMTPConfigRequest:
      type: object
      properties:
        host:
          type: string
          title: host
          description: host is the host name or the IP address of the server, without a port.
        port:
          type: integer
          title: port
          format: int32
          description: port is the TCP port, 1 to 65535. 0 takes the usual port of tls.
        tls:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SMTPSecurity'
          title: tls
          description: tls says how the connection is encrypted. Unspecified means SMTP_SECURITY_STARTTLS.
        username:
          type: string
          title: username
          description: username is the SMTP login, or empty for a server without a login.
        password:
          type:
            - string
            - "null"
          title: password
          description: |-
            password is the SMTP password. Leave it out to keep the password that is set now.
             An empty password removes it. A username needs a password, and a password needs a username.
        from:
          type: string
          title: from
          description: from is the sender of the mail, such as "hopbox <no-reply@example.org>".
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the install config that the caller read.
             If the config has another version now, the call fails with ABORTED and changes nothing.
      title: SetSMTPConfigRequest
      additionalProperties: false
      description: SetSMTPConfigRequest holds the whole new SMTP config.
    hopbox.admin.v1.SetSMTPConfigResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.SMTPConfig'
          title: config
      title: SetSMTPConfigResponse
      additionalProperties: false
      description: SetSMTPConfigResponse holds the SMTP config after the change.
    hopbox.admin.v1.SetServerLabelsRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server.
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
          description: labels are the new labels, such as zone=gra. They replace every label of the server.
      title: SetServerLabelsRequest
      additionalProperties: false
      description: SetServerLabelsRequest names a server and its new labels.
    hopbox.admin.v1.SetServerLabelsResponse:
      type: object
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: server
      title: SetServerLabelsResponse
      additionalProperties: false
      description: SetServerLabelsResponse holds the server after the change.
    hopbox.admin.v1.SignInProvider:
      type: string
      title: SignInProvider
      enum:
        - SIGN_IN_PROVIDER_UNSPECIFIED
        - SIGN_IN_PROVIDER_GITHUB
        - SIGN_IN_PROVIDER_GOOGLE
      description: SignInProvider is a provider of sign-in through OAuth.
    hopbox.admin.v1.Size:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the size, a lowercase DNS label, such as default.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the count of vCPUs, 1 to 32.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: 'memory_bytes is the RAM, in bytes: at least 128 MiB, and a whole number of MiB.'
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: |-
            disk_bytes is the size of the sparse disk, in bytes: at least 1 GB, and a whole number of
             512-byte sectors.
        pool:
          type: string
          title: pool
          description: pool is the name of the pool of the machines of the size, or empty for any pool.
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
          description: labels are the labels that a node must have to take a machine of the size, such as disk=nvme.
        retireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: retire_time
          description: retire_time is the time of the retirement. It is absent while the size takes new machines.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the size.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the create.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change.
      title: Size
      additionalProperties: false
      description: Size is a size of machine, as an instance admin sees it.
    hopbox.admin.v1.StageKEKRequest:
      type: object
      title: StageKEKRequest
      additionalProperties: false
      description: StageKEKRequest has no fields.
    hopbox.admin.v1.StageKEKResponse:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          description: key_id is the ID of the staged key-encryption key, for example file:2.
        file:
          type: string
          title: file
          description: |-
            file is the path of the staged key file on this server, for example
             /var/lib/hopbox/kek/2.staged. Copy it to the same path on each other control server.
      title: StageKEKResponse
      additionalProperties: false
      description: StageKEKResponse names the staged key.
    hopbox.admin.v1.StopMachineRequest:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      title: StopMachineRequest
      description: StopMachineRequest names one machine.
    hopbox.admin.v1.StopMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Machine'
          title: machine
          description: machine is the machine at the end of the wait.
        duration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: duration
          description: duration is how long the call took, the wait included.
        done:
          type: boolean
          title: done
          description: done is true when the machine is stopped at the end of the wait.
      title: StopMachineResponse
      additionalProperties: false
      description: StopMachineResponse holds the machine after the wait.
    hopbox.admin.v1.SuspendOrgRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org.
        reason:
          type: string
          title: reason
          description: |-
            reason is shown to the members of the org: at most 256 characters, without control characters.
             On an org that is suspended already, the call keeps the reason of the suspension.
      title: SuspendOrgRequest
      additionalProperties: false
      description: SuspendOrgRequest names the org.
    hopbox.admin.v1.SuspendOrgResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Org'
          title: org
      title: SuspendOrgResponse
      additionalProperties: false
      description: SuspendOrgResponse holds the org after the change.
    hopbox.admin.v1.UncordonServerRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the ID of the server.
      title: UncordonServerRequest
      additionalProperties: false
      description: UncordonServerRequest names a server.
    hopbox.admin.v1.UncordonServerResponse:
      type: object
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Server'
          title: server
      title: UncordonServerResponse
      additionalProperties: false
      description: UncordonServerResponse holds the server after the change.
    hopbox.admin.v1.UnsuspendOrgRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org.
      title: UnsuspendOrgRequest
      additionalProperties: false
      description: UnsuspendOrgRequest names the org.
    hopbox.admin.v1.UnsuspendOrgResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.Org'
          title: org
      title: UnsuspendOrgResponse
      additionalProperties: false
      description: UnsuspendOrgResponse holds the org after the change.
    hopbox.admin.v1.UpdateInstallConfigRequest:
      type: object
      properties:
        domain:
          type:
            - string
            - "null"
          title: domain
          description: |-
            domain is the new domain of the install: a lowercase DNS name with at least two labels,
             such as hop.example.org. Leave it out to keep the domain.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the settings that the caller read.
             If the settings have another version now, the call fails with ABORTED and changes nothing.
             Leave it out to change the settings at any version.
        publicAddresses:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.PublicAddresses'
          title: public_addresses
          description: |-
            public_addresses replaces the public addresses of the install. Leave it out to keep them.
             An empty list removes them.
        acmeDirectoryUrl:
          type:
            - string
            - "null"
          title: acme_directory_url
          description: |-
            acme_directory_url is the new ACME directory: an https URL of at most 2048 characters, without user info
             or a fragment. Leave it out to keep the directory. A new directory names another CA, so it also sets
             acme_terms_agreed to false, unless the request sets acme_terms_agreed too.
        acmeEmail:
          type:
            - string
            - "null"
          title: acme_email
          description: |-
            acme_email is the new contact email of the ACME account. An empty string removes the contact.
             Leave it out to keep the email.
        acmeTermsAgreed:
          type:
            - boolean
            - "null"
          title: acme_terms_agreed
          description: |-
            acme_terms_agreed set to true records that the caller agrees to the terms of the CA of the directory.
             Set to false, it stops new certificates. Leave it out to keep it.
        mailTransport:
          oneOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.MailTransport'
            - type: "null"
          title: mail_transport
          description: |-
            mail_transport is the new mail transport. MAIL_TRANSPORT_UNSPECIFIED fails with INVALID_ARGUMENT.
             The SMTP config stays, so a switch back to MAIL_TRANSPORT_SMTP needs no new config. Leave it out to keep the transport.
      title: UpdateInstallConfigRequest
      additionalProperties: false
      description: UpdateInstallConfigRequest holds the settings to change.
    hopbox.admin.v1.UpdateInstallConfigResponse:
      type: object
      properties:
        config:
          allOf:
            - $ref: '#/components/schemas/hopbox.admin.v1.InstallConfig'
          title: config
      title: UpdateInstallConfigResponse
      additionalProperties: false
      description: UpdateInstallConfigResponse holds the settings after the change.
    hopbox.v1.Machine:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the machine.
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org of the machine.
        name:
          type: string
          title: name
          description: name is the name of the machine, unique in the install. It is the first label of its URL.
        state:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineState'
          title: state
          description: state is the current state.
        targetState:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineState'
          title: target_state
          description: target_state is the state that the machine must reach.
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineSize'
          title: size
          description: size is the size of the machine.
        imageName:
          type: string
          title: image_name
          description: image_name is the name of the image that the machine started from, for example default.
        imageDigest:
          type: string
          title: image_digest
          description: 'image_digest is the digest of that image: "sha256:" and 64 hex digits.'
        creatorAccountId:
          type: string
          title: creator_account_id
          description: |-
            creator_account_id is the UUID of the account that made the machine.
             It is empty for a machine that an org key made, and after the delete of the account.
        creatorKeyId:
          type: string
          title: creator_key_id
          description: creator_key_id is the UUID of the org key that made the machine, or empty.
        shared:
          type: boolean
          title: shared
          description: shared is true for a machine that is open to the whole org.
        restartPolicy:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.RestartPolicy'
          title: restart_policy
          description: restart_policy says what happens when the machine stops by itself.
        startCommand:
          type: string
          title: start_command
          description: start_command is the command that the guest agent runs after each boot, or empty.
        autoDeleteTimeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: auto_delete_timeout
          description: |-
            auto_delete_timeout is the time without use after which hopbox deletes the machine. Unset is off.
             The delete comes 1 to 2 minutes after this time from the last recorded use: a use is recorded
             at most once a minute, and the auto-delete job runs once a minute.
        url:
          type: string
          title: url
          description: url is https://<name>.<domain>, or empty while the install has no domain.
        urlPort:
          type: integer
          title: url_port
          format: int32
          description: url_port is the port in the machine that the URL reaches. The default is 8000.
        urlVisibility:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.URLVisibility'
          title: url_visibility
          description: url_visibility says who can open the URL.
        sshPort:
          type: integer
          title: ssh_port
          format: int32
          description: ssh_port is the SSH port of the machine on the edge servers, 10000 to 30000. It never changes.
        rebootPending:
          type: boolean
          title: reboot_pending
          description: reboot_pending is true while a reboot that a request asked for did not run yet.
        lastActivityTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_activity_time
          description: last_activity_time is the last use of the machine, for the auto-delete timeout.
        stateChangeTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: state_change_time
          description: state_change_time is the time of the last change of the current state.
        deleteRequestTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: delete_request_time
          description: delete_request_time is the time of the delete request, or unset.
        version:
          type: string
          title: version
          format: int64
          description: 'version grows by 1 with each change of the machine: by a request, by a report of its executor, or by an env change that reaches it.'
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the creation time of the machine.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change that a request made.
        skippedEnvVars:
          type: integer
          title: skipped_env_vars
          format: int32
          description: skipped_env_vars is the count of env vars and secrets that the guest agent of the running machine left out, because their names break its rules.
      title: Machine
      additionalProperties: false
      description: Machine is a machine as its users see it.
    hopbox.v1.MachineSize:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the size, for example default.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the count of vCPUs.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the RAM, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the size of the sparse disk, in bytes.
      title: MachineSize
      additionalProperties: false
      description: 'MachineSize is a size of a machine: its vCPUs, its RAM, and its sparse disk.'
    hopbox.v1.MachineState:
      type: string
      title: MachineState
      enum:
        - MACHINE_STATE_UNSPECIFIED
        - MACHINE_STATE_PENDING
        - MACHINE_STATE_STARTING
        - MACHINE_STATE_RUNNING
        - MACHINE_STATE_STANDBY
        - MACHINE_STATE_HIBERNATED
        - MACHINE_STATE_STOPPED
        - MACHINE_STATE_FAILED
        - MACHINE_STATE_DELETED
        - MACHINE_STATE_MOVING
      description: MachineState is the state of a machine.
    hopbox.v1.RestartPolicy:
      type: string
      title: RestartPolicy
      enum:
        - RESTART_POLICY_UNSPECIFIED
        - RESTART_POLICY_ALWAYS
        - RESTART_POLICY_NEVER
      description: RestartPolicy says what the executor does when a machine stops by itself.
    hopbox.v1.URLVisibility:
      type: string
      title: URLVisibility
      enum:
        - URL_VISIBILITY_UNSPECIFIED
        - URL_VISIBILITY_PRIVATE
        - URL_VISIBILITY_PUBLIC
      description: URLVisibility says who can open the URL of a machine.
security: []
tags:
  - name: hopbox.admin.v1.AccountService
    description: |-
      AccountService lets an operator recover the sign-in of an account, for example after its
       person lost the GitHub user that the account signs in with.
  - name: hopbox.admin.v1.AdminKeyService
    description: |-
      AdminKeyService manages the admin API keys. An admin API key has install scope and calls the
       admin API, for example from the hopbox Terraform provider. It expires like other API keys.
       Only root on a control server, through the admin socket, calls this service,
       so no key makes another key.
  - name: hopbox.admin.v1.CertificateService
    description: CertificateService reads the wildcard certificate of the install and the state of the ACME job that gets it.
  - name: hopbox.admin.v1.ImageService
    description: 'ImageService manages the images that new machines start from: the metadata of image artifacts.'
  - name: hopbox.admin.v1.InstallConfigService
    description: InstallConfigService reads and changes the settings of the whole install.
  - name: hopbox.admin.v1.InstanceAdminService
    description: |-
      InstanceAdminService manages the instance admins, the accounts that operate the install.
       An install keeps at least one instance admin.
  - name: hopbox.admin.v1.KeyringService
    description: KeyringService manages the key-encryption keys that seal secrets.
  - name: hopbox.admin.v1.LoginLinkService
    description: LoginLinkService makes the one-time sign-in links of the first instance admin.
  - name: hopbox.admin.v1.MachineService
    description: |-
      MachineService lets instance admins see the machines of every org, and stop or delete any of them,
       also in a suspended org, for example to handle abuse.
       It never opens a shell in a machine and never reads its secrets.
  - name: hopbox.admin.v1.MailService
    description: |-
      MailService reads the mail files that the file mail transport wrote on this control server
       (MAIL_TRANSPORT_FILE). The files hold sign-in links and invitation links, so the policy allows only
       root on the server, through the admin socket. Each control server has its own files.
  - name: hopbox.admin.v1.OrgService
    description: |-
      OrgService lets instance admins see the metadata of every org, suspend an org, and set usage limits.
       It shows no member and no resource of an org.
  - name: hopbox.admin.v1.PoolService
    description: |-
      PoolService manages the pools: the named groups of servers. Each enrollment token enrolls a
       server into one pool, and all servers of a pool have identical hardware. An operator size can
       keep its machines in one pool.
  - name: hopbox.admin.v1.ServerService
    description: ServerService enrolls servers and manages the servers of the install.
  - name: hopbox.admin.v1.SizeService
    description: |-
      SizeService manages the sizes of machines. A user picks a size for a new machine, and the size
       can keep its machines in one pool, on the nodes with some labels. A size never changes: to
       change one, add a size with a new name and retire the old one.
