  /hopbox.admin.v1.InstallConfigService/SetMaintenance:
    post:
      tags:
        - hopbox.admin.v1.InstallConfigService
      summary: SetMaintenance
      description: |-
        SetMaintenance turns maintenance mode of the install on or off. In maintenance mode, the API refuses every
         call without the option (hopbox.v1.read_only) with UNAVAILABLE, and the control role closes every control
         channel and takes no new one. A call that turns it on returns after the calls and the channels that ran
         have ended. Only root on a control server calls it, through the admin socket, which takes it also in
         maintenance mode.
      operationId: hopbox.admin.v1.InstallConfigService.SetMaintenance
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.SetMaintenanceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.SetMaintenanceResponse'
