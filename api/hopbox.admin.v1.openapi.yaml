      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.ListImagesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.ListImagesResponse'
  /hopbox.admin.v1.ImageService/RegisterImage:
    post:
      tags:
        - hopbox.admin.v1.ImageService
      summary: RegisterImage
      description: |-
        RegisterImage adds an image from the bytes of its artifact.json.
         The newest image of a name is the one that new machines of that name take.
         The same artifact.json a second time changes nothing and returns the image that exists.
      operationId: hopbox.admin.v1.ImageService.RegisterImage
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.admin.v1.RegisterImageRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.admin.v1.RegisterImageResponse'
