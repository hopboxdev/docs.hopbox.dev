    post:
      tags:
        - hopbox.admin.v1.InstallConfigService
      summary: SetOAuthClient
      description: SetOAuthClient sets the OAuth client of one sign-in provider. The secret is sealed with the current key-encryption key.
      operationId: hopbox.admin.v1.InstallConfigService.SetOAuthClient
      parameters:
        - name: Connect-Protocol-Version
          in: header
