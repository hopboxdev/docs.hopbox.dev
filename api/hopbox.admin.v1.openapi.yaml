         The token works once and expires after 1 hour. The response holds the only copy of the token:
         the install keeps only a hash of its secret. A retry with the same idempotency key makes no
         second token. It fails with ALREADY_EXISTS, because the install has no copy of the secret.
      operationId: hopbox.admin.v1.ServerService.CreateEnrollmentToken
