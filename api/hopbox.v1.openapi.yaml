openapi: 3.1.0
info:
  title: hopbox public API
  description: The public API of hopbox, package hopbox.v1.
  version: v1
paths:
  /hopbox.v1.APIKeyService/CreateAPIKey:
    post:
      tags:
        - hopbox.v1.APIKeyService
      summary: CreateAPIKey
      description: |-
        CreateAPIKey makes a key. Any member makes a member key for itself.
         The org admins and owners make org keys. The response holds the only copy of the key:
         the install keeps only its hash. A retry with the same idempotency key makes no
         second key. It fails with ALREADY_EXISTS.
      operationId: hopbox.v1.APIKeyService.CreateAPIKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.CreateAPIKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.CreateAPIKeyResponse'
  /hopbox.v1.APIKeyService/ListAPIKeys:
    post:
      tags:
        - hopbox.v1.APIKeyService
      summary: ListAPIKeys
      description: |-
        ListAPIKeys lists the keys of an org that the caller manages, oldest first:
         the own member keys for a member, every key of the org for an org admin or owner.
      operationId: hopbox.v1.APIKeyService.ListAPIKeys
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.ListAPIKeysRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.ListAPIKeysResponse'
  /hopbox.v1.APIKeyService/RevokeAPIKey:
    post:
      tags:
        - hopbox.v1.APIKeyService
      summary: RevokeAPIKey
      description: |-
        RevokeAPIKey deletes a key at once. A member deletes its own member keys.
         An org admin or owner deletes any key of the org.
      operationId: hopbox.v1.APIKeyService.RevokeAPIKey
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.RevokeAPIKeyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.RevokeAPIKeyResponse'
  /hopbox.v1.AccountService/DeleteAccount:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: DeleteAccount
      description: |-
        DeleteAccount deletes the account, its personal org, its sessions, and its sign-in methods.
         It fails while the account is the only owner of another org, or the last instance admin.
      operationId: hopbox.v1.AccountService.DeleteAccount
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.DeleteAccountRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.DeleteAccountResponse'
  /hopbox.v1.AccountService/EndCLISignIn:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: EndCLISignIn
      description: EndCLISignIn ends one CLI sign-in of the account, with all of its tokens, for example one on a lost laptop.
      operationId: hopbox.v1.AccountService.EndCLISignIn
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.EndCLISignInRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.EndCLISignInResponse'
  /hopbox.v1.AccountService/GetAccount:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: GetAccount
      description: GetAccount returns the account of the caller.
      operationId: hopbox.v1.AccountService.GetAccount
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.GetAccountRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.GetAccountResponse'
  /hopbox.v1.AccountService/ListCLISignIns:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: ListCLISignIns
      description: 'ListCLISignIns lists the CLI sign-ins of the account, oldest first: each device that holds CLI tokens.'
      operationId: hopbox.v1.AccountService.ListCLISignIns
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.ListCLISignInsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.ListCLISignInsResponse'
  /hopbox.v1.AccountService/ListSignInMethods:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: ListSignInMethods
      description: ListSignInMethods lists the sign-in methods of the account, oldest first.
      operationId: hopbox.v1.AccountService.ListSignInMethods
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.ListSignInMethodsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.ListSignInMethodsResponse'
  /hopbox.v1.AccountService/RemoveSignInMethod:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: RemoveSignInMethod
      description: RemoveSignInMethod removes one sign-in method. An account keeps at least one.
      operationId: hopbox.v1.AccountService.RemoveSignInMethod
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.RemoveSignInMethodRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.RemoveSignInMethodResponse'
  /hopbox.v1.AccountService/SetSignUpNote:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: SetSignUpNote
      description: |-
        SetSignUpNote writes the note of a pending account to the instance admins. A new note replaces the old one.
         An account that is not pending fails with FAILED_PRECONDITION.
      operationId: hopbox.v1.AccountService.SetSignUpNote
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.SetSignUpNoteRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.SetSignUpNoteResponse'
  /hopbox.v1.AccountService/UpdateAccount:
    post:
      tags:
        - hopbox.v1.AccountService
      summary: UpdateAccount
      description: UpdateAccount changes the fields that the request sets, and keeps the others.
      operationId: hopbox.v1.AccountService.UpdateAccount
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.UpdateAccountRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.UpdateAccountResponse'
  /hopbox.v1.AuditService/ListAuditEntries:
    post:
      tags:
        - hopbox.v1.AuditService
      summary: ListAuditEntries
      description: |-
        ListAuditEntries returns audit entries, newest first.
         Org owners and org admins read the entries of their org.
         Instance admins read the entries of every org and of the whole install.
      operationId: hopbox.v1.AuditService.ListAuditEntries
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.ListAuditEntriesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.ListAuditEntriesResponse'
  /hopbox.v1.AuthService/ApproveDevice:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: ApproveDevice
      description: |-
        ApproveDevice approves a user code for the account of the session.
         The console page /device calls it with the create_time that GetDeviceAuthorization returned.
         The session needs a recent sign-in. An older one gets permission_denied with the detail RecentSignInRequired.
      operationId: hopbox.v1.AuthService.ApproveDevice
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.ApproveDeviceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.ApproveDeviceResponse'
  /hopbox.v1.AuthService/GetDeviceAuthorization:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: GetDeviceAuthorization
      description: |-
        GetDeviceAuthorization returns the client of a user code that waits for its approval,
         so the console page /device shows the person which client it signs in. Session only.
      operationId: hopbox.v1.AuthService.GetDeviceAuthorization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.GetDeviceAuthorizationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.GetDeviceAuthorizationResponse'
  /hopbox.v1.AuthService/PollDeviceAuthorization:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: PollDeviceAuthorization
      description: |-
        PollDeviceAuthorization asks whether a person approved the device code.
         The first poll after the approval returns the CLI tokens, once.
      operationId: hopbox.v1.AuthService.PollDeviceAuthorization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.PollDeviceAuthorizationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.PollDeviceAuthorizationResponse'
  /hopbox.v1.AuthService/RefreshCLIToken:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: RefreshCLIToken
      description: |-
        RefreshCLIToken trades a refresh token for a new access token and a new refresh token.
         Each refresh token works once. A used refresh token that comes back ends the whole CLI sign-in.
      operationId: hopbox.v1.AuthService.RefreshCLIToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.RefreshCLITokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.RefreshCLITokenResponse'
  /hopbox.v1.AuthService/RequestMagicLink:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: RequestMagicLink
      description: |-
        RequestMagicLink sends a sign-in link to an email. It answers the same for every email,
         so it tells nothing about who has an account.
         With link, it sends a link that adds the email to the account of the session instead.
         The session needs a recent sign-in. An older one gets permission_denied with the detail RecentSignInRequired.
      operationId: hopbox.v1.AuthService.RequestMagicLink
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.RequestMagicLinkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.RequestMagicLinkResponse'
  /hopbox.v1.AuthService/SignOut:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: SignOut
      description: |-
        SignOut ends the session of the caller and clears the session cookie.
         With a CLI access token, it ends the CLI sign-in of the token, with all of its tokens.
      operationId: hopbox.v1.AuthService.SignOut
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.SignOutRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.SignOutResponse'
  /hopbox.v1.AuthService/StartDeviceAuthorization:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: StartDeviceAuthorization
      description: |-
        StartDeviceAuthorization starts the device flow of the hopbox CLI (RFC 8628).
         It needs no credential. The CLI shows the user code and the verification URI,
         then polls with the device code.
      operationId: hopbox.v1.AuthService.StartDeviceAuthorization
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.StartDeviceAuthorizationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.StartDeviceAuthorizationResponse'
  /hopbox.v1.AuthService/VerifyLoginLink:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: VerifyLoginLink
      description: VerifyLoginLink signs in with the token of a first-admin login link, and sets the session cookie.
      operationId: hopbox.v1.AuthService.VerifyLoginLink
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.VerifyLoginLinkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hopbox.v1.VerifyLoginLinkResponse'
  /hopbox.v1.AuthService/VerifyMagicLink:
    post:
      tags:
        - hopbox.v1.AuthService
      summary: VerifyMagicLink
      description: |-
        VerifyMagicLink signs in with the token of a magic link, and sets the session cookie.
         The token of a link from RequestMagicLink with link adds the email to the account of the session
         that asked for it, and sets no cookie. Only that session can use it.
      operationId: hopbox.v1.AuthService.VerifyMagicLink
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hopbox.v1.VerifyMagicLinkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
