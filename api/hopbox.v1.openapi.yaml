              schema:
                $ref: '#/components/schemas/hopbox.v1.SetVarResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    hopbox.v1.APIKey:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the key.
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org of the key.
        kind:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.APIKeyKind'
          title: kind
        name:
          type: string
          title: name
          description: name is the name that its creator gave the key, such as ci.
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account of a member key, and empty for an org key.
        creatorAccountId:
          type: string
          title: creator_account_id
          description: creator_account_id is the UUID of the account that made the key, or empty after its deletion.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the key.
        lastUseTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_use_time
          description: last_use_time is the time of the last call with the key, exact to a minute. It is unset for an unused key.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the creation of the key.
      title: APIKey
      additionalProperties: false
      description: APIKey is an API key without its secret.
    hopbox.v1.APIKeyKind:
      type: string
      title: APIKeyKind
      enum:
        - API_KEY_KIND_UNSPECIFIED
        - API_KEY_KIND_MEMBER
        - API_KEY_KIND_ORG
      description: APIKeyKind is the kind of an API key.
    hopbox.v1.APIKeyLifetime:
      type: string
      title: APIKeyLifetime
      enum:
        - API_KEY_LIFETIME_UNSPECIFIED
        - API_KEY_LIFETIME_30_DAYS
        - API_KEY_LIFETIME_90_DAYS
        - API_KEY_LIFETIME_365_DAYS
      description: APIKeyLifetime is a preset lifetime of a new API key.
    hopbox.v1.AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: 'token is the value after #token= in the link.'
      title: AcceptInvitationRequest
      additionalProperties: false
      description: AcceptInvitationRequest holds the token of the link.
    hopbox.v1.AcceptInvitationResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Org'
          title: org
      title: AcceptInvitationResponse
      additionalProperties: false
      description: AcceptInvitationResponse holds the org that the caller joined.
    hopbox.v1.Account:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the account.
        displayName:
          type: string
          title: display_name
          description: display_name is the name that the person chose. It can be empty.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.AccountEmail'
          title: emails
          description: emails lists the emails of the account.
        instanceAdmin:
          type: boolean
          title: instance_admin
          description: instance_admin is true when the account operates the install.
        personalOrgId:
          type: string
          title: personal_org_id
          description: personal_org_id is the UUID of the personal org of the account.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the account.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the first sign-in.
        adminNotices:
          type: integer
          title: admin_notices
          format: int32
          description: |-
            admin_notices counts the open notices of an instance admin, which the Admin area lists.
             It is 0 for any other account.
        pending:
          type: boolean
          title: pending
          description: |-
            pending is true while the account waits for approval by an instance admin. A pending account only
             reads its account, writes its note, deletes itself, and signs out. Each other call fails with
             PERMISSION_DENIED and the detail AccountPending.
        signUpNote:
          type: string
          title: sign_up_note
          description: sign_up_note is the note of a pending account to the instance admins, or empty.
      title: Account
      additionalProperties: false
      description: Account is the record of one person in the install.
    hopbox.v1.AccountEmail:
      type: object
      properties:
        email:
          type: string
          title: email
          description: email is the address, in lower case.
        verified:
          type: boolean
          title: verified
          description: |-
            verified is true when a sign-in method proved the email.
             Only a verified email links other sign-in methods to the account.
        verifyTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: verify_time
          description: verify_time is the time of the proof. It is unset for an email that is not verified.
      title: AccountEmail
      additionalProperties: false
      description: AccountEmail is one email of an account.
    hopbox.v1.AccountPending:
      type: object
      title: AccountPending
      additionalProperties: false
      description: |-
        AccountPending is the detail of the PERMISSION_DENIED error of a call of a pending account that such an
         account cannot make. The console then shows the page of a pending account.
    hopbox.v1.AddSSHKeyRequest:
      type: object
      properties:
        publicKey:
          type: string
          title: public_key
          description: public_key is one line of the authorized_keys form, as in ~/.ssh/id_ed25519.pub.
        name:
          type: string
          title: name
          description: |-
            name helps people tell their keys apart. The default is the comment of the key, such as ann@laptop.
             It has at most 64 characters.
      title: AddSSHKeyRequest
      additionalProperties: false
      description: AddSSHKeyRequest holds the key.
    hopbox.v1.AddSSHKeyResponse:
      type: object
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.SSHKey'
          title: key
      title: AddSSHKeyResponse
      additionalProperties: false
      description: AddSSHKeyResponse holds the new key.
    hopbox.v1.ApproveDeviceRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
          description: user_code is the code that the client shows. Case, dashes, and spaces do not matter.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: |-
            create_time is the create_time of GetDeviceAuthorizationResponse for the code. The approval
             fails unless it matches, so the console approves only a client that it showed.
      title: ApproveDeviceRequest
      additionalProperties: false
      description: ApproveDeviceRequest holds the user code and the start of the device sign-in that the console showed.
    hopbox.v1.ApproveDeviceResponse:
      type: object
      properties:
        clientName:
          type: string
          title: client_name
          description: client_name is the name that the client gave at its start.
        clientIp:
          type: string
          title: client_ip
          description: client_ip is the IP address that started the device sign-in, or empty.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the start of the device sign-in.
      title: ApproveDeviceResponse
      additionalProperties: false
      description: ApproveDeviceResponse describes the client that the approval signs in.
    hopbox.v1.AuditActor:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is the kind of caller, such as session, local_root, or system.
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account behind the call, or empty.
        credentialId:
          type: string
          title: credential_id
          description: credential_id is the UUID of the session, key, token, or server that made the call, or empty.
      title: AuditActor
      additionalProperties: false
      description: AuditActor is the caller of an action.
    hopbox.v1.AuditEntry:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the entry.
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org of the action. It is unset for an action on the whole install.
        actor:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.AuditActor'
          title: actor
          description: actor is the caller that did the action.
        action:
          type: string
          title: action
          description: action names the action, such as auth.sign_in.
        targetKind:
          type: string
          title: target_kind
          description: target_kind is the kind of object of the action, such as account. It is empty for an action without an object.
        targetId:
          type: string
          title: target_id
          description: target_id is the ID or the name of the object.
        details:
          type: object
          title: details
          additionalProperties:
            type: string
            title: value
          description: details holds more facts about the action. It never holds a secret value.
        requestId:
          type: string
          title: request_id
          description: request_id is the ID of the API request, or empty.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the action.
      title: AuditEntry
      additionalProperties: false
      description: AuditEntry records one action.
    hopbox.v1.CLISignIn:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the CLI sign-in, the cli_sign_in_id of its tokens.
        clientName:
          type: string
          title: client_name
          description: client_name is the name that the CLI gave at the start of the device flow.
        clientIp:
          type: string
          title: client_ip
          description: client_ip is the IP address that started the device flow, or empty.
        lastUseTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_use_time
          description: last_use_time is the last call with an access token of the sign-in, exact to a minute.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the start of the CLI sign-in.
        lastUseIp:
          type: string
          title: last_use_ip
          description: last_use_ip is the IP address of the last call with an access token of the sign-in, or empty.
      title: CLISignIn
      additionalProperties: false
      description: 'CLISignIn is one CLI sign-in of the account: a device that holds CLI tokens.'
    hopbox.v1.CLITokens:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
          description: 'access_token starts with hbxat_. It goes in the header "Authorization: Bearer <token>".'
        accessTokenExpireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: access_token_expire_time
          description: access_token_expire_time is the end of the access token, 1 hour after its issue.
        refreshToken:
          type: string
          title: refresh_token
          description: refresh_token starts with hbxrt_. It works once, with RefreshCLIToken.
        refreshTokenExpireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: refresh_token_expire_time
          description: refresh_token_expire_time is the end of the refresh token, 30 days after its issue.
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account of the tokens.
        cliSignInId:
          type: string
          title: cli_sign_in_id
          description: cli_sign_in_id is the UUID of the CLI sign-in. Every refresh keeps it.
      title: CLITokens
      additionalProperties: false
      description: CLITokens are the tokens of a CLI sign-in. The install keeps only their hashes.
    hopbox.v1.CreateAPIKeyRequest:
      type: object
      anyOf:
        - type: object
          properties:
            expireTime:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: expire_time
              description: expire_time is a custom end, in the future and at most 365 days ahead.
          title: expire_time
        - type: object
          properties:
            lifetime:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.APIKeyLifetime'
              title: lifetime
              description: lifetime is a preset lifetime.
          title: lifetime
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - expireTime
              - required:
                  - lifetime
          - not:
              oneOf:
                - required:
                    - expireTime
                - required:
                    - lifetime
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org of the key. The default is the personal org of the caller.
        kind:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.APIKeyKind'
          title: kind
          description: kind is the kind of the key. The default is a member key.
        name:
          type: string
          title: name
          description: name helps people tell their keys apart, such as ci. It has 1 to 64 characters.
      title: CreateAPIKeyRequest
      description: CreateAPIKeyRequest describes the new key.
    hopbox.v1.CreateAPIKeyResponse:
      type: object
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.APIKey'
          title: key
        secret:
          type: string
          title: secret
          description: |-
            secret is the key itself, which starts with hbx_. It goes in the header
             "Authorization: Bearer <secret>". The install keeps no copy of it.
      title: CreateAPIKeyResponse
      additionalProperties: false
      description: CreateAPIKeyResponse holds the new key and its secret.
    hopbox.v1.CreateInvitationRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org, which the call refuses.
        email:
          type: string
          title: email
          description: email is the email of the person to invite, such as ann@example.org.
        role:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgRole'
          title: role
          description: role is the role that the invitation gives. ORG_ROLE_UNSPECIFIED gives ORG_ROLE_MEMBER.
      title: CreateInvitationRequest
      additionalProperties: false
      description: CreateInvitationRequest names the email and the role.
    hopbox.v1.CreateInvitationResponse:
      type: object
      properties:
        invitation:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Invitation'
          title: invitation
        url:
          type: string
          title: url
          description: |-
            url is the link of the invitation, such as https://hop.example.org/invite#token=<token>.
             It is a secret until its use or its end. The server keeps only its hash.
        emailSent:
          type: boolean
          title: email_sent
          description: |-
            email_sent is true when the server sent the link to the email.
             It is false without an SMTP config, when the email failed, and when the install writes its mail to files
             (mail_to_files in GetInstallInfoResponse). Then pass the link to the person yourself.
      title: CreateInvitationResponse
      additionalProperties: false
      description: CreateInvitationResponse holds the invitation and its link.
    hopbox.v1.CreateMachineRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the org of the machine. Leave it out for the org of an API key, or the personal org.
        name:
          type: string
          title: name
          description: name is the name of the machine. Leave it empty to get a free name, such as box1.
        size:
          type: string
          title: size
          description: size is the name of a size. Leave it empty for default.
        image:
          type: string
          title: image
          description: image is the name of an image. Leave it empty for default.
        restartPolicy:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.RestartPolicy'
          title: restart_policy
          description: restart_policy is the restart policy. Leave it unspecified for always.
        startCommand:
          type: string
          title: start_command
          description: start_command is a command that the guest agent runs after each boot, at most 4096 bytes.
        autoDeleteTimeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: auto_delete_timeout
          description: |-
            auto_delete_timeout deletes the machine after this time without use: 1 minute to 365 days.
             The delete comes 1 to 2 minutes after this time from the last recorded use.
             Leave it unset to keep the machine.
      title: CreateMachineRequest
      additionalProperties: false
      description: CreateMachineRequest asks for a new machine.
    hopbox.v1.CreateMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machine
          description: machine is the new machine, with the state pending.
      title: CreateMachineResponse
      additionalProperties: false
      description: CreateMachineResponse holds the new machine.
    hopbox.v1.CreateOrgRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            name is the name of the org: 1 to 64 characters, without control characters,
             and without spaces at either end.
      title: CreateOrgRequest
      additionalProperties: false
      description: CreateOrgRequest names the new org.
    hopbox.v1.CreateOrgResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Org'
          title: org
      title: CreateOrgResponse
      additionalProperties: false
      description: CreateOrgResponse holds the new org.
    hopbox.v1.DeleteAccountRequest:
      type: object
      title: DeleteAccountRequest
      additionalProperties: false
      description: DeleteAccountRequest has no fields.
    hopbox.v1.DeleteAccountResponse:
      type: object
      title: DeleteAccountResponse
      additionalProperties: false
      description: DeleteAccountResponse has no fields.
    hopbox.v1.DeleteMachineRequest:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      title: DeleteMachineRequest
      description: DeleteMachineRequest names one machine.
    hopbox.v1.DeleteMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machine
          description: machine is the machine at the end of the wait.
        duration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: duration
          description: duration is how long the call took, the wait included.
        done:
          type: boolean
          title: done
          description: done is true when the machine is deleted at the end of the wait.
      title: DeleteMachineResponse
      additionalProperties: false
      description: DeleteMachineResponse holds the machine after the wait.
    hopbox.v1.DeleteOrgRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org, which the call refuses.
        confirm:
          type: string
          title: confirm
          description: confirm must be the name of the org.
      title: DeleteOrgRequest
      additionalProperties: false
      description: DeleteOrgRequest names the org.
    hopbox.v1.DeleteOrgResponse:
      type: object
      title: DeleteOrgResponse
      additionalProperties: false
      description: DeleteOrgResponse has no fields.
    hopbox.v1.DeleteVarRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. The default is the org of the API key, or else the personal org of the caller.
        name:
          type: string
          title: name
          description: name is the name of the value.
        scope:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.VarScope'
          title: scope
          description: scope is the scope of the value. The default is shared.
      title: DeleteVarRequest
      additionalProperties: false
      description: DeleteVarRequest names the value.
    hopbox.v1.DeleteVarResponse:
      type: object
      title: DeleteVarResponse
      additionalProperties: false
      description: DeleteVarResponse has no fields.
    hopbox.v1.DeviceAuthorizationState:
      type: string
      title: DeviceAuthorizationState
      enum:
        - DEVICE_AUTHORIZATION_STATE_UNSPECIFIED
        - DEVICE_AUTHORIZATION_STATE_PENDING
        - DEVICE_AUTHORIZATION_STATE_SLOW_DOWN
        - DEVICE_AUTHORIZATION_STATE_APPROVED
      description: DeviceAuthorizationState is the answer of a poll.
    hopbox.v1.DownloadInfo:
      type: object
      properties:
        archive:
          type: boolean
          title: archive
          description: archive is true when the data is a tar stream of the contents of a directory. Otherwise it is the contents of one file.
        mode:
          type: integer
          title: mode
          description: mode is the permission bits of the file or the directory.
        size:
          type: string
          title: size
          format: int64
          description: size is the size of a file in bytes, or zero for an archive.
      title: DownloadInfo
      additionalProperties: false
      description: DownloadInfo says what a download holds.
    hopbox.v1.DownloadRequest:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      properties:
        path:
          type: string
          title: path
          description: path is the source path, at most 4096 bytes. A relative path starts at the home directory of the user.
        user:
          type: string
          title: user
          description: user is the Linux user whose home directory a relative path starts at. Leave it empty for the main user, user.
      title: DownloadRequest
      description: DownloadRequest names a file or a directory to read from a machine.
    hopbox.v1.DownloadResponse:
      type: object
      anyOf:
        - type: object
          properties:
            data:
              type: string
              title: data
              format: byte
              description: data is the next bytes, at most 32 KiB in one message.
          title: data
        - type: object
          properties:
            info:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.DownloadInfo'
              title: info
              description: info says what the data holds. It is always the first message.
          title: info
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - data
              - required:
                  - info
          - not:
              oneOf:
                - required:
                    - data
                - required:
                    - info
      title: DownloadResponse
      description: DownloadResponse is one message of a download.
    hopbox.v1.EndCLISignInRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the CLI sign-in.
      title: EndCLISignInRequest
      additionalProperties: false
      description: EndCLISignInRequest names the CLI sign-in.
    hopbox.v1.EndCLISignInResponse:
      type: object
      title: EndCLISignInResponse
      additionalProperties: false
      description: EndCLISignInResponse has no fields.
    hopbox.v1.ExecChunk:
      type: object
      anyOf:
        - type: object
          properties:
            exit:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.ExecExit'
              title: exit
              description: exit is how the command ended. It is always the last chunk from the server.
          title: exit
        - type: object
          properties:
            resize:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.TerminalSize'
              title: resize
              description: resize is a new size of the terminal.
          title: resize
        - type: object
          properties:
            signal:
              type: string
              title: signal
              description: signal sends a signal to the command, by name, such as SIGINT or SIGTERM.
          title: signal
        - type: object
          properties:
            start:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.ExecStart'
              title: start
              description: start names the machine and the command. It is always the first chunk from the client, and only the first.
          title: start
        - type: object
          properties:
            stderr:
              type: string
              title: stderr
              format: byte
              description: stderr is error output of the command.
          title: stderr
        - type: object
          properties:
            stdin:
              type: string
              title: stdin
              format: byte
              description: stdin is input for the command, at most 1 MiB in one chunk.
          title: stdin
        - type: object
          properties:
            stdinEof:
              type: boolean
              title: stdin_eof
              description: stdin_eof tells that no more input comes. With a terminal, the command reads the end-of-file character, Ctrl-D.
          title: stdin_eof
        - type: object
          properties:
            stdout:
              type: string
              title: stdout
              format: byte
              description: stdout is output of the command. With a terminal, all output arrives as stdout.
          title: stdout
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - exit
              - required:
                  - resize
              - required:
                  - signal
              - required:
                  - start
              - required:
                  - stderr
              - required:
                  - stdin
              - required:
                  - stdinEof
              - required:
                  - stdout
          - not:
              oneOf:
                - required:
                    - exit
                - required:
                    - resize
                - required:
                    - signal
                - required:
                    - start
                - required:
                    - stderr
                - required:
                    - stdin
                - required:
                    - stdinEof
                - required:
                    - stdout
      title: ExecChunk
      description: ExecChunk is one part of an exec. The WebSocket endpoint /api/ws/exec carries the same message, one in each binary frame.
    hopbox.v1.ExecExit:
      type: object
      properties:
        code:
          type: integer
          title: code
          format: int32
          description: |-
            code is the exit code of the command. It is 128 plus the signal number after a signal, 127 for a program that does not exist,
             126 when the command did not start for another reason, and 124 after the timeout.
        signal:
          type: string
          title: signal
          description: signal is the name of the signal that ended the command, such as SIGKILL, or empty.
        error:
          type: string
          title: error
          description: error says why the command did not start, or is empty.
        timedOut:
          type: boolean
          title: timed_out
          description: timed_out is true when the timeout of the exec ended the command.
      title: ExecExit
      additionalProperties: false
      description: ExecExit is how a command ended.
    hopbox.v1.ExecRequest:
      type: object
      properties:
        chunk:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.ExecChunk'
          title: chunk
          description: chunk is the next part of the exec. The first message holds start. The next ones hold stdin, stdin_eof, resize, or signal.
      title: ExecRequest
      additionalProperties: false
      description: ExecRequest is one message from the client on Exec.
    hopbox.v1.ExecResponse:
      type: object
      properties:
        chunk:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.ExecChunk'
          title: chunk
          description: 'chunk is the next part of the exec: stdout, stderr, and at the end exit.'
      title: ExecResponse
      additionalProperties: false
      description: ExecResponse is one message from the server on Exec.
    hopbox.v1.ExecStart:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      properties:
        argv:
          type: array
          items:
            type: string
          title: argv
          description: |-
            argv is the program and its arguments, at most 4096 items and 256 KiB in all.
             Leave it empty for the login shell of the user, as hopbox connect does.
        env:
          type: object
          title: env
          additionalProperties:
            type: string
            title: value
          description: env are env vars on top of the env of the machine, at most 256 and 256 KiB in all.
        user:
          type: string
          title: user
          description: user is the Linux user that runs the command. Leave it empty for the main user, user.
        dir:
          type: string
          title: dir
          description: dir is the working directory. Leave it empty for the home directory of the user.
        tty:
          type: boolean
          title: tty
          description: tty runs the command in a terminal, for a shell.
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.TerminalSize'
          title: size
          description: size is the first size of the terminal, when tty is set.
        term:
          type: string
          title: term
          description: term is the TERM env var, when tty is set. Leave it empty for xterm-256color.
        timeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: timeout
          description: timeout ends the command after this time, from 1 second to 24 hours. Leave it unset for no timeout.
      title: ExecStart
      description: ExecStart names the machine and the command of an exec.
    hopbox.v1.GetAccountRequest:
      type: object
      title: GetAccountRequest
      additionalProperties: false
      description: GetAccountRequest has no fields.
    hopbox.v1.GetAccountResponse:
      type: object
      properties:
        account:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Account'
          title: account
      title: GetAccountResponse
      additionalProperties: false
      description: GetAccountResponse holds the account.
    hopbox.v1.GetDeviceAuthorizationRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
          description: user_code is the code that the client shows. Case, dashes, and spaces do not matter.
      title: GetDeviceAuthorizationRequest
      additionalProperties: false
      description: GetDeviceAuthorizationRequest holds the user code.
    hopbox.v1.GetDeviceAuthorizationResponse:
      type: object
      properties:
        clientName:
          type: string
          title: client_name
          description: client_name is the name that the client gave at its start.
        clientIp:
          type: string
          title: client_ip
          description: client_ip is the IP address that started the device sign-in, or empty.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the start of the device sign-in. ApproveDevice needs it back.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the device sign-in.
      title: GetDeviceAuthorizationResponse
      additionalProperties: false
      description: GetDeviceAuthorizationResponse describes the client that waits for the approval.
    hopbox.v1.GetInstallInfoRequest:
      type: object
      title: GetInstallInfoRequest
      additionalProperties: false
      description: GetInstallInfoRequest has no fields.
    hopbox.v1.GetInstallInfoResponse:
      type: object
      properties:
        domain:
          type: string
          title: domain
          description: |-
            domain is the domain of the install, for example hop.example.org.
             It is empty until an instance admin sets it.
        signInMethods:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.SignInMethod'
          title: sign_in_methods
          description: |-
            sign_in_methods lists the sign-in methods that anyone can use on the install.
             SIGN_IN_METHOD_EMAIL_LINK is in it while the install has an SMTP config or writes its mail to files.
             SIGN_IN_METHOD_GITHUB and SIGN_IN_METHOD_GOOGLE are in it while the install has a domain and the client of the provider.
             A browser starts such a sign-in at https://<domain>/auth/github/start or https://<domain>/auth/google/start.
        sshHostKey:
          type: string
          title: ssh_host_key
          description: |-
            ssh_host_key is the public host key of the SSH front door, in the
             authorized_keys format, for example "ssh-ed25519 AAAA...".
             It is empty until the install has an SSH front door.
        version:
          type: string
          title: version
          description: version is the version of hopboxd on the server that answered, for example v0.1.0.
        mailToFiles:
          type: boolean
          title: mail_to_files
          description: |-
            mail_to_files is true on a dev or test install that writes each email to a file on its server,
             instead of a send. Then no sign-in link or invitation reaches its recipient by email.
      title: GetInstallInfoResponse
      additionalProperties: false
      description: GetInstallInfoResponse holds the public facts of the install.
    hopbox.v1.GetMachineRequest:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      title: GetMachineRequest
      description: GetMachineRequest names one machine.
    hopbox.v1.GetMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machine
          description: machine is the machine.
      title: GetMachineResponse
      additionalProperties: false
      description: GetMachineResponse holds one machine.
    hopbox.v1.GetOrgRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org.
      title: GetOrgRequest
      additionalProperties: false
      description: GetOrgRequest names the org.
    hopbox.v1.GetOrgResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Org'
          title: org
      title: GetOrgResponse
      additionalProperties: false
      description: GetOrgResponse holds the org.
    hopbox.v1.GetOrgUsageRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org.
      title: GetOrgUsageRequest
      additionalProperties: false
      description: GetOrgUsageRequest names the org.
    hopbox.v1.GetOrgUsageResponse:
      type: object
      properties:
        usage:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgUsage'
          title: usage
          description: usage is what the org uses now.
        limits:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgLimits'
          title: limits
          description: 'limits are the limits of the org: the default of the install, or the limits that an instance admin set.'
      title: GetOrgUsageResponse
      additionalProperties: false
      description: GetOrgUsageResponse holds the usage and the limits.
    hopbox.v1.Invitation:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the invitation.
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org.
        email:
          type: string
          title: email
          description: email is the email that the invitation is for, in lower case.
        role:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgRole'
          title: role
          description: role is the role that the invitation gives.
        inviterAccountId:
          type: string
          title: inviter_account_id
          description: inviter_account_id is the UUID of the account that made the invitation, or empty when it is gone.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the invitation.
        expireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expire_time
          description: expire_time is the end of the invitation.
      title: Invitation
      additionalProperties: false
      description: Invitation is an open invitation to join an org.
    hopbox.v1.LeaveOrgRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org, which the call refuses.
      title: LeaveOrgRequest
      additionalProperties: false
      description: LeaveOrgRequest names the org.
    hopbox.v1.LeaveOrgResponse:
      type: object
      title: LeaveOrgResponse
      additionalProperties: false
      description: LeaveOrgResponse has no fields.
    hopbox.v1.LinkedSignInMethod:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the method on this account.
        method:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.SignInMethod'
          title: method
          description: method is the kind of sign-in.
        email:
          type: string
          title: email
          description: email is the email that the method names.
        lastUseTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_use_time
          description: last_use_time is the time of the last sign-in with the method.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time when the method joined the account.
      title: LinkedSignInMethod
      additionalProperties: false
      description: LinkedSignInMethod is one way to sign in to an account.
    hopbox.v1.ListAPIKeysRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. The default is the personal org of the caller.
      title: ListAPIKeysRequest
      additionalProperties: false
      description: ListAPIKeysRequest names the org.
    hopbox.v1.ListAPIKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.APIKey'
          title: keys
      title: ListAPIKeysResponse
      additionalProperties: false
      description: ListAPIKeysResponse lists the keys.
    hopbox.v1.ListAuditEntriesRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: |-
            org_id is the UUID of the org whose entries to read.
             Leave it out to read the personal org of the caller.
        wholeInstall:
          type: boolean
          title: whole_install
          description: |-
            whole_install reads the entries of every org and of the install.
             Only an instance admin may set it, and org_id must then be left out.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: page_size is the most entries in one response, 1 to 500. 0 means 50.
        pageToken:
          type: string
          title: page_token
          description: page_token is the next_page_token of the response before. Leave it empty for the newest entries.
      title: ListAuditEntriesRequest
      additionalProperties: false
      description: ListAuditEntriesRequest selects the entries.
    hopbox.v1.ListAuditEntriesResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.AuditEntry'
          title: entries
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token reads the next, older page. It is empty on the last page.
      title: ListAuditEntriesResponse
      additionalProperties: false
      description: ListAuditEntriesResponse holds one page of entries.
    hopbox.v1.ListCLISignInsRequest:
      type: object
      title: ListCLISignInsRequest
      additionalProperties: false
      description: ListCLISignInsRequest has no fields.
    hopbox.v1.ListCLISignInsResponse:
      type: object
      properties:
        signIns:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.CLISignIn'
          title: sign_ins
      title: ListCLISignInsResponse
      additionalProperties: false
      description: ListCLISignInsResponse lists the CLI sign-ins.
    hopbox.v1.ListInvitationsRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org.
      title: ListInvitationsRequest
      additionalProperties: false
      description: ListInvitationsRequest names the org.
    hopbox.v1.ListInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.Invitation'
          title: invitations
      title: ListInvitationsResponse
      additionalProperties: false
      description: ListInvitationsResponse lists the open invitations.
    hopbox.v1.ListMachineSizesRequest:
      type: object
      title: ListMachineSizesRequest
      additionalProperties: false
      description: ListMachineSizesRequest has no fields.
    hopbox.v1.ListMachineSizesResponse:
      type: object
      properties:
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.MachineSize'
          title: sizes
          description: sizes are the sizes, smallest first.
      title: ListMachineSizesResponse
      additionalProperties: false
      description: ListMachineSizesResponse holds the sizes of the install.
    hopbox.v1.ListMachinesRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the org. Leave it out for the org of an API key, or the personal org.
      title: ListMachinesRequest
      additionalProperties: false
      description: ListMachinesRequest names an org.
    hopbox.v1.ListMachinesResponse:
      type: object
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machines
          description: machines are the machines, by name.
      title: ListMachinesResponse
      additionalProperties: false
      description: ListMachinesResponse holds the machines of the org that the caller sees.
    hopbox.v1.ListOrgMembersRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org.
      title: ListOrgMembersRequest
      additionalProperties: false
      description: ListOrgMembersRequest names the org.
    hopbox.v1.ListOrgMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.OrgMember'
          title: members
      title: ListOrgMembersResponse
      additionalProperties: false
      description: ListOrgMembersResponse lists the members.
    hopbox.v1.ListOrgsRequest:
      type: object
      title: ListOrgsRequest
      additionalProperties: false
      description: ListOrgsRequest has no fields.
    hopbox.v1.ListOrgsResponse:
      type: object
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.Org'
          title: orgs
      title: ListOrgsResponse
      additionalProperties: false
      description: ListOrgsResponse lists the orgs of the caller.
    hopbox.v1.ListSSHKeysRequest:
      type: object
      title: ListSSHKeysRequest
      additionalProperties: false
      description: ListSSHKeysRequest has no fields.
    hopbox.v1.ListSSHKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.SSHKey'
          title: keys
      title: ListSSHKeysResponse
      additionalProperties: false
      description: ListSSHKeysResponse lists the keys.
    hopbox.v1.ListSignInMethodsRequest:
      type: object
      title: ListSignInMethodsRequest
      additionalProperties: false
      description: ListSignInMethodsRequest has no fields.
    hopbox.v1.ListSignInMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.LinkedSignInMethod'
          title: methods
      title: ListSignInMethodsResponse
      additionalProperties: false
      description: ListSignInMethodsResponse lists the sign-in methods.
    hopbox.v1.ListVarsRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. The default is the org of the API key, or else the personal org of the caller.
      title: ListVarsRequest
      additionalProperties: false
      description: ListVarsRequest names the org.
    hopbox.v1.ListVarsResponse:
      type: object
      properties:
        vars:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.Var'
          title: vars
      title: ListVarsResponse
      additionalProperties: false
      description: ListVarsResponse lists the values.
    hopbox.v1.Machine:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the machine.
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org of the machine.
        name:
          type: string
          title: name
          description: name is the name of the machine, unique in the install. It is the first label of its URL.
        state:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineState'
          title: state
          description: state is the current state.
        targetState:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineState'
          title: target_state
          description: target_state is the state that the machine must reach.
        size:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineSize'
          title: size
          description: size is the size of the machine.
        imageName:
          type: string
          title: image_name
          description: image_name is the name of the image that the machine started from, for example default.
        imageDigest:
          type: string
          title: image_digest
          description: 'image_digest is the digest of that image: "sha256:" and 64 hex digits.'
        creatorAccountId:
          type: string
          title: creator_account_id
          description: |-
            creator_account_id is the UUID of the account that made the machine.
             It is empty for a machine that an org key made, and after the delete of the account.
        creatorKeyId:
          type: string
          title: creator_key_id
          description: creator_key_id is the UUID of the org key that made the machine, or empty.
        shared:
          type: boolean
          title: shared
          description: shared is true for a machine that is open to the whole org.
        restartPolicy:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.RestartPolicy'
          title: restart_policy
          description: restart_policy says what happens when the machine stops by itself.
        startCommand:
          type: string
          title: start_command
          description: start_command is the command that the guest agent runs after each boot, or empty.
        autoDeleteTimeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: auto_delete_timeout
          description: |-
            auto_delete_timeout is the time without use after which hopbox deletes the machine. Unset is off.
             The delete comes 1 to 2 minutes after this time from the last recorded use: a use is recorded
             at most once a minute, and the auto-delete job runs once a minute.
        url:
          type: string
          title: url
          description: url is https://<name>.<domain>, or empty while the install has no domain.
        urlPort:
          type: integer
          title: url_port
          format: int32
          description: url_port is the port in the machine that the URL reaches. The default is 8000.
        urlVisibility:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.URLVisibility'
          title: url_visibility
          description: url_visibility says who can open the URL.
        sshPort:
          type: integer
          title: ssh_port
          format: int32
          description: ssh_port is the SSH port of the machine on the edge servers, 10000 to 30000. It never changes.
        rebootPending:
          type: boolean
          title: reboot_pending
          description: reboot_pending is true while a reboot that a request asked for did not run yet.
        lastActivityTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_activity_time
          description: last_activity_time is the last use of the machine, for the auto-delete timeout.
        stateChangeTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: state_change_time
          description: state_change_time is the time of the last change of the current state.
        deleteRequestTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: delete_request_time
          description: delete_request_time is the time of the delete request, or unset.
        version:
          type: string
          title: version
          format: int64
          description: 'version grows by 1 with each change of the machine: by a request, by a report of its executor, or by an env change that reaches it.'
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the creation time of the machine.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last change that a request made.
        skippedEnvVars:
          type: integer
          title: skipped_env_vars
          format: int32
          description: skipped_env_vars is the count of env vars and secrets that the guest agent of the running machine left out, because their names break its rules.
      title: Machine
      additionalProperties: false
      description: Machine is a machine as its users see it.
    hopbox.v1.MachineLogEntry:
      type: object
      properties:
        time:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: time
          description: time is when the guest agent read the line.
        stream:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.MachineLogStream'
          title: stream
          description: stream is the output that the line came from.
        data:
          type: string
          title: data
          format: byte
          description: data is the line without its newline. A line longer than 16 KiB arrives in parts.
        dropped:
          type: string
          title: dropped
          format: int64
          description: dropped is the count of lines that were lost before this one, because a buffer was full.
      title: MachineLogEntry
      additionalProperties: false
      description: MachineLogEntry is one line of output of the start command of a machine.
    hopbox.v1.MachineLogStream:
      type: string
      title: MachineLogStream
      enum:
        - MACHINE_LOG_STREAM_UNSPECIFIED
        - MACHINE_LOG_STREAM_STDOUT
        - MACHINE_LOG_STREAM_STDERR
      description: MachineLogStream names the output that a line of the log came from.
    hopbox.v1.MachineNameTaken:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name that the request asked for.
        suggestedName:
          type: string
          title: suggested_name
          description: suggested_name is a free name close to it, or empty when hopbox found none.
      title: MachineNameTaken
      additionalProperties: false
      description: |-
        MachineNameTaken is the detail of the already_exists error of a create or a rename
         whose machine name another machine holds, or another org holds in reservation.
    hopbox.v1.MachineSize:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the name of the size, for example default.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the count of vCPUs.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the RAM, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the size of the sparse disk, in bytes.
      title: MachineSize
      additionalProperties: false
      description: 'MachineSize is a size of a machine: its vCPUs, its RAM, and its sparse disk.'
    hopbox.v1.MachineState:
      type: string
      title: MachineState
      enum:
        - MACHINE_STATE_UNSPECIFIED
        - MACHINE_STATE_PENDING
        - MACHINE_STATE_STARTING
        - MACHINE_STATE_RUNNING
        - MACHINE_STATE_STANDBY
        - MACHINE_STATE_HIBERNATED
        - MACHINE_STATE_STOPPED
        - MACHINE_STATE_FAILED
        - MACHINE_STATE_DELETED
        - MACHINE_STATE_MOVING
      description: MachineState is the state of a machine.
    hopbox.v1.Org:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the org.
        name:
          type: string
          title: name
          description: name is the name of the org.
        personal:
          type: boolean
          title: personal
          description: personal is true for the personal org of an account.
        role:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgRole'
          title: role
          description: role is the role of the caller in the org.
        suspended:
          type: boolean
          title: suspended
          description: suspended is true while an instance admin suspends the org.
        suspendTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: suspend_time
          description: suspend_time is the start of the suspension. It is unset for an org that is not suspended.
        suspendReason:
          type: string
          title: suspend_reason
          description: suspend_reason is the reason that the instance admin gave, or empty.
        version:
          type: string
          title: version
          format: int64
          description: version grows by 1 with each change of the org.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time when the org was created.
      title: Org
      additionalProperties: false
      description: Org is an org as one of its members sees it.
    hopbox.v1.OrgLimits:
      type: object
      properties:
        machines:
          type: integer
          title: machines
          format: int32
          description: machines is the most machines.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus is the most vCPUs of all machines together.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the most RAM of all machines together, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the most disk of all machines together, in bytes.
      title: OrgLimits
      additionalProperties: false
      description: OrgLimits are the usage limits of an org. A limit of 0 allows nothing.
    hopbox.v1.OrgMember:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
          description: account_id is the UUID of the account.
        displayName:
          type: string
          title: display_name
          description: display_name is the display name of the account.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/hopbox.v1.AccountEmail'
          title: emails
          description: emails lists the emails of the account.
        role:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.OrgRole'
          title: role
          description: role is the role of the account in the org.
        joinTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: join_time
          description: join_time is the time when the account joined the org.
      title: OrgMember
      additionalProperties: false
      description: OrgMember is one account in an org.
    hopbox.v1.OrgRole:
      type: string
      title: OrgRole
      enum:
        - ORG_ROLE_UNSPECIFIED
        - ORG_ROLE_MEMBER
        - ORG_ROLE_ADMIN
        - ORG_ROLE_OWNER
      description: |-
        OrgRole is the rights of an account in an org.
         Each role has the rights of the role before it.
    hopbox.v1.OrgUsage:
      type: object
      properties:
        machines:
          type: integer
          title: machines
          format: int32
          description: machines counts the machines.
        vcpus:
          type: integer
          title: vcpus
          format: int32
          description: vcpus counts the vCPUs of all machines.
        memoryBytes:
          type: string
          title: memory_bytes
          format: int64
          description: memory_bytes is the RAM of all machines, in bytes.
        diskBytes:
          type: string
          title: disk_bytes
          format: int64
          description: disk_bytes is the disk of all machines, in bytes.
      title: OrgUsage
      additionalProperties: false
      description: OrgUsage is what an org uses of its limits.
    hopbox.v1.PollDeviceAuthorizationRequest:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
          description: device_code is the device_code of StartDeviceAuthorizationResponse.
      title: PollDeviceAuthorizationRequest
      additionalProperties: false
      description: PollDeviceAuthorizationRequest holds the device code.
    hopbox.v1.PollDeviceAuthorizationResponse:
      type: object
      properties:
        state:
          allOf:
