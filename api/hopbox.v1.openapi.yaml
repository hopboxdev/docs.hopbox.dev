              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      properties:
        restartPolicy:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.RestartPolicy'
          title: restart_policy
          description: restart_policy is the new restart policy. RESTART_POLICY_UNSPECIFIED keeps it.
        startCommand:
          type:
            - string
            - "null"
          title: start_command
          description: start_command is the new start command. An empty string removes it.
        autoDeleteTimeout:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: auto_delete_timeout
          description: auto_delete_timeout is the new auto-delete timeout. A zero duration turns it off.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version that the caller read. If the machine has another version now,
             the call fails with aborted and changes nothing. The version also grows without a request, for
             example at each report of the executor, so read the machine again and retry.
      title: UpdateMachineRequest
      description: UpdateMachineRequest names one machine and the settings to change. A field left out keeps its value.
    hopbox.v1.UpdateMachineResponse:
      type: object
      properties:
        machine:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Machine'
          title: machine
          description: machine is the machine after the change.
      title: UpdateMachineResponse
      additionalProperties: false
      description: UpdateMachineResponse holds the machine after the change.
    hopbox.v1.UpdateOrgRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the UUID of the org. Leave it out for the personal org.
        name:
          type:
            - string
            - "null"
          title: name
          description: name is the new name of the org. Leave it out to keep the name.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version of the org that the caller read.
             If the org has another version now, the call fails with ABORTED and changes nothing.
      title: UpdateOrgRequest
      additionalProperties: false
      description: UpdateOrgRequest holds the fields to change.
    hopbox.v1.UpdateOrgResponse:
      type: object
      properties:
        org:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Org'
          title: org
      title: UpdateOrgResponse
      additionalProperties: false
      description: UpdateOrgResponse holds the org after the change.
    hopbox.v1.UploadRequest:
      type: object
      anyOf:
        - type: object
          properties:
            data:
              type: string
              title: data
              format: byte
              description: data is the next bytes, at most 1 MiB in one message. The end of the client stream is the end of the data.
          title: data
        - type: object
          properties:
            start:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.UploadStart'
              title: start
              description: start names the machine and the target. It is always the first message, and only the first.
          title: start
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - data
              - required:
                  - start
          - not:
              oneOf:
                - required:
                    - data
                - required:
                    - start
      title: UploadRequest
      description: UploadRequest is one message from the client on Upload.
    hopbox.v1.UploadResponse:
      type: object
      properties:
        bytes:
          type: string
          title: bytes
          format: int64
          description: bytes is the count of bytes that the machine received.
      title: UploadResponse
      additionalProperties: false
      description: UploadResponse is the result of an upload.
    hopbox.v1.UploadStart:
      type: object
      anyOf:
        - type: object
          properties:
            id:
              type: string
              title: id
              description: id is the UUID of the machine.
          title: id
        - type: object
          properties:
            name:
              type: string
              title: name
              description: name is the name of the machine.
          title: name
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - id
              - required:
                  - name
          - not:
              oneOf:
                - required:
                    - id
                - required:
                    - name
      properties:
        path:
          type: string
          title: path
          description: path is the target path, at most 4096 bytes. A relative path starts at the home directory of the user.
        archive:
          type: boolean
          title: archive
          description: |-
            archive is true when the data is a tar stream of the contents of a directory.
             The machine extracts it into the directory path, and makes the directory when it does not exist.
             Otherwise the data is the contents of one file.
        mode:
          type: integer
          title: mode
          description: mode is the permission bits of a file, such as 0755. Leave it zero for 0644. An archive carries its own.
        user:
          type: string
          title: user
          description: user is the Linux user that owns the new files. Leave it empty for the main user, user.
      title: UploadStart
      description: UploadStart names the machine and the target of an upload.
    hopbox.v1.Var:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the UUID of the value.
        orgId:
          type: string
          title: org_id
          description: org_id is the UUID of the org of the value.
        name:
          type: string
          title: name
          description: name is the name of the env var in the machine, such as DATABASE_URL.
        scope:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.VarScope'
          title: scope
        secret:
          type: boolean
          title: secret
          description: secret is true for a sealed value.
        value:
          type: string
          title: value
          description: value is the value of an env var, and empty for a secret.
        ownerAccountId:
          type: string
          title: owner_account_id
          description: owner_account_id is the UUID of the account of a private value, and empty for a shared or an all value.
        updaterAccountId:
          type: string
          title: updater_account_id
          description: updater_account_id is the UUID of the account that set the value last, or empty after its deletion.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: create_time is the time of the first set of the value.
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
          description: update_time is the time of the last set of the value.
      title: Var
      additionalProperties: false
      description: Var is an env var or a secret.
    hopbox.v1.VarScope:
      type: string
      title: VarScope
      enum:
        - VAR_SCOPE_UNSPECIFIED
        - VAR_SCOPE_SHARED
        - VAR_SCOPE_PRIVATE
        - VAR_SCOPE_ALL
      description: VarScope says which machines of the org a value reaches.
    hopbox.v1.VerifyLoginLinkRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: token is the value after "#token=" in the link.
      title: VerifyLoginLinkRequest
      additionalProperties: false
      description: VerifyLoginLinkRequest holds the token of the link.
    hopbox.v1.VerifyLoginLinkResponse:
      type: object
      properties:
        account:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Account'
          title: account
        newAccount:
          type: boolean
          title: new_account
          description: new_account is true when this sign-in created the account.
        sessionExpireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: session_expire_time
          description: |-
            session_expire_time is the end of the session, 30 days after the sign-in.
             A session that no call uses for 7 days ends before.
      title: VerifyLoginLinkResponse
      additionalProperties: false
      description: VerifyLoginLinkResponse names the account of the new session.
    hopbox.v1.VerifyMagicLinkRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          description: token is the value after "#token=" in the link.
      title: VerifyMagicLinkRequest
      additionalProperties: false
      description: VerifyMagicLinkRequest holds the token of the link.
    hopbox.v1.VerifyMagicLinkResponse:
      type: object
      properties:
        account:
          allOf:
            - $ref: '#/components/schemas/hopbox.v1.Account'
          title: account
        newAccount:
          type: boolean
          title: new_account
          description: new_account is true when this sign-in created the account.
        sessionExpireTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: session_expire_time
          description: |-
            session_expire_time is the end of the session, 30 days after the sign-in.
             A session that no call uses for 7 days ends before. It is unset when linked is true.
        linked:
          type: boolean
          title: linked
          description: |-
            linked is true when the link added its email to the account of the session.
             No new session starts then, and the session cookie stays.
      title: VerifyMagicLinkResponse
      additionalProperties: false
      description: VerifyMagicLinkResponse names the account of the new session, or the account that the link added the email to.
    hopbox.v1.WatchMachinesRequest:
      type: object
      properties:
        orgId:
          type:
            - string
            - "null"
          title: org_id
          description: org_id is the org. Leave it out for the org of an API key, or the personal org.
      title: WatchMachinesRequest
      additionalProperties: false
      description: WatchMachinesRequest names an org.
    hopbox.v1.WatchMachinesResponse:
      type: object
      anyOf:
        - type: object
          properties:
            goneMachineId:
              type: string
              title: gone_machine_id
              description: gone_machine_id is the UUID of a machine that the caller no longer sees, for example after an unshare.
          title: gone_machine_id
        - type: object
          properties:
            machine:
              allOf:
                - $ref: '#/components/schemas/hopbox.v1.Machine'
              title: machine
              description: 'machine is a machine as it is now: in the first list, new, or changed.'
          title: machine
        - type: object
          properties:
            synced:
              type: boolean
              title: synced
              description: synced marks the end of the first list. Every later message is a change.
          title: synced
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - goneMachineId
              - required:
                  - machine
              - required:
                  - synced
          - not:
              oneOf:
                - required:
                    - goneMachineId
                - required:
                    - machine
                - required:
                    - synced
      title: WatchMachinesResponse
      description: WatchMachinesResponse is one message of the stream.
security: []
tags:
  - name: hopbox.v1.MachineService
    description: |-
      MachineService creates, reads, and changes the machines of an org.
       A request on one machine names it by its ID or by its name: names are unique in the whole install.
       A lifecycle call only sets the target state of the machine.
       The executor on its node then moves the machine there, and the call waits for it for up to 60 seconds.
  - name: hopbox.v1.InstallService
    description: InstallService describes the install to a client before it signs in.
  - name: hopbox.v1.AccountService
    description: |-
      AccountService reads and changes the account of the caller.
       Each call acts on the account of the session that calls it.
  - name: hopbox.v1.APIKeyService
    description: |-
      APIKeyService manages the API keys of an org. An API key belongs to one org and expires.
       A member key acts as its account in that org. An org key is a service credential of the org,
       with the rights of a member without personal resources. No API key can call this service,
       so no key makes, lists, or deletes another key.
  - name: hopbox.v1.AuditService
    description: 'AuditService reads the audit log: who did which action.'
  - name: hopbox.v1.AuthService
    description: |-
      AuthService signs people in to the console of the install, and the hopbox CLI with a device flow.
       A call that starts a session sets the session cookie __Host-hopbox_session.
       A call that sets or carries the cookie must carry the Origin of the install
       and use the Connect protocol.
  - name: hopbox.v1.OrgService
    description: |-
      OrgService manages the orgs of the caller, their members, and their invitations.
       A request that leaves out org_id acts in the personal org of the caller.
  - name: hopbox.v1.SSHKeyService
    description: |-
      SSHKeyService manages the SSH keys of the account of the caller. An SSH key opens the machines
       that the account can reach through the SSH front door. Each key works for one account only.
  - name: hopbox.v1.VarService
    description: |-
      VarService manages the env vars and secrets of an org. hopbox puts them into the machines
       of the org at boot and into every login shell. An env var can be read back. A secret is
       sealed, and no call returns its value. The scope of a value says which machines it reaches.
       A request that leaves out org_id acts in the org of the API key, or else in the personal
       org of the caller.
